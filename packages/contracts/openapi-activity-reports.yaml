openapi: 3.1.0
info:
  title: SmartLab Activity Report API module
  version: 0.24.0
  description: |
    Canonical ActivityReport lifecycle through S3.5. Normal reports are created atomically
    by LaboratorySession end; manual backfill never invents a Session. SmartLab stores
    participant aggregates only. S3.5 adds immutable private evidence attachments whose
    storage keys are never exposed by the API. S3.6 adds an idempotent draft-sync endpoint
    for controlled offline working copies; the browser cache never becomes canonical truth.
paths:
  /activity-reports:
    get:
      operationId: listActivityReports
      summary: List Activity Reports in the active School
      description: Requires activity-reports.view. Users without activity-reports.view-all are limited to own report scope.
      security: &auth [{ sanctumSession: [] }, { sanctumBearer: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: laboratoryId, in: query, schema: { type: string, format: ulid } }
        - { name: reportType, in: query, schema: { $ref: '#/components/schemas/ActivityReportType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ActivityReportStatus' } }
        - { name: origin, in: query, schema: { $ref: '#/components/schemas/ActivityReportOrigin' } }
        - { name: scope, in: query, schema: { type: string, enum: [mine, all] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        '200': { description: Paginated Activity Report collection }
        '403': { description: all scope requested without activity-reports.view-all }
        '422': { description: Query validation failed }

  /activity-reports/backfill:
    post:
      operationId: createActivityReportBackfill
      summary: Create exceptional historical evidence without a fake Session
      description: Requires activity-reports.create-backfill. Always starts as draft.
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBackfillInput' }
      responses:
        '201': { description: Manual backfill draft created with ETag version }
        '403': { description: Permission missing }
        '422': { description: Backfill evidence or content invalid }

  /activity-reports/{reportId}:
    parameters:
      - { name: reportId, in: path, required: true, schema: { type: string, format: ulid } }
    get:
      operationId: getActivityReport
      security: *auth
      responses:
        '200': { description: Activity Report detail and append-oriented timeline }
        '404': { description: Missing, cross-School, or outside caller scope }
    patch:
      operationId: updateActivityReport
      summary: Edit report content while status=draft
      security: *auth
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateActivityReportInput' }
      responses:
        '200': { description: Draft updated with a new ETag version }
        '409': { description: Report not editable }
        '412': { description: Version conflict }
        '422': { description: Content invalid }
        '428': { description: Missing or malformed If-Match }

  /activity-reports/{reportId}/sync-draft:
    parameters:
      - { name: reportId, in: path, required: true, schema: { type: string, format: ulid } }
    post:
      operationId: syncActivityReportDraft
      summary: Idempotently apply a controlled offline draft working copy
      description: |
        Requires activity-reports.edit. The client sends a stable UUID clientMutationId,
        the canonical baseVersion from which its local working copy was derived, and a
        non-empty patch containing only ordinary editable ActivityReport draft fields.

        A new mutation is accepted only when the report is still draft and its current
        version exactly equals baseVersion. The server stores a receipt containing the
        canonical payload SHA-256 and resulting version. Retrying the same report,
        clientMutationId, baseVersion, and canonical patch returns the already-applied
        result without another version bump or audit event. Reusing a clientMutationId
        for different content is rejected.

        If the canonical report changed since the working copy was created, the server
        returns ACTIVITY_REPORT_OFFLINE_SYNC_CONFLICT and does not merge or overwrite.
        Conflict resolution is an explicit client/user operation against a newly loaded
        server version. Session lifecycle, observations/Incidents, submission/verification,
        backfill, and attachment transfer remain online-only and are not queued here.
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncActivityReportDraftInput' }
      responses:
        '200':
          description: Draft mutation applied once, or an exact retry replayed safely
          content:
            application/json:
              schema:
                type: object
                required: [data, sync]
                properties:
                  data:
                    type: object
                    description: Canonical ActivityReport resource after synchronization.
                  sync: { $ref: '#/components/schemas/ActivityReportDraftSyncMeta' }
        '404': { description: Report missing, cross-School, or outside caller scope }
        '409':
          description: Report is not draft, baseVersion is stale, or clientMutationId was reused with different base/content.
        '422': { description: UUID, baseVersion, patch, content, or aggregate attendance is invalid }

  /activity-reports/{reportId}/submit:
    parameters:
      - { name: reportId, in: path, required: true, schema: { type: string, format: ulid } }
      - $ref: '#/components/parameters/IfMatch'
    post:
      operationId: submitActivityReport
      summary: Submit a complete draft for verification
      security: *auth
      responses:
        '200': { description: Submitted report with new ETag version }
        '409': { description: Invalid lifecycle state }
        '412': { description: Version conflict }
        '422': { description: Required content incomplete }
        '428': { description: Missing or malformed If-Match }

  /activity-reports/{reportId}/request-revision:
    parameters:
      - { name: reportId, in: path, required: true, schema: { type: string, format: ulid } }
      - $ref: '#/components/parameters/IfMatch'
    post:
      operationId: requestActivityReportRevision
      summary: Return a submitted report for revision
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200': { description: Report becomes revision_required }
        '409': { description: Invalid lifecycle state }
        '412': { description: Version conflict }
        '428': { description: Missing or malformed If-Match }

  /activity-reports/{reportId}/reopen:
    parameters:
      - { name: reportId, in: path, required: true, schema: { type: string, format: ulid } }
      - $ref: '#/components/parameters/IfMatch'
    post:
      operationId: reopenActivityReport
      summary: Reopen a revision-required report as draft
      security: *auth
      responses:
        '200': { description: Draft reopened with new ETag version }
        '409': { description: Invalid lifecycle state }
        '412': { description: Version conflict }
        '428': { description: Missing or malformed If-Match }

  /activity-reports/{reportId}/verify:
    parameters:
      - { name: reportId, in: path, required: true, schema: { type: string, format: ulid } }
      - $ref: '#/components/parameters/IfMatch'
    post:
      operationId: verifyActivityReport
      summary: Verify a submitted report
      security: *auth
      responses:
        '200': { description: Verified report with new ETag version }
        '409': { description: Invalid lifecycle state }
        '412': { description: Version conflict }
        '428': { description: Missing or malformed If-Match }

  /activity-reports/{reportId}/attachments:
    parameters:
      - { name: reportId, in: path, required: true, schema: { type: string, format: ulid } }
    get:
      operationId: listActivityReportAttachments
      summary: List immutable private attachment metadata
      description: Requires activity-reports.view. storage_key is never returned.
      security: *auth
      responses:
        '200': { description: Attachment metadata collection including current availability flag }
        '404': { description: Report missing, cross-School, or outside caller scope }
    post:
      operationId: uploadActivityReportAttachment
      summary: Add private evidence to an editable draft
      description: |
        Requires activity-reports.edit and If-Match. Upload is draft-only, increments the
        ActivityReport version, records an audit event, computes SHA-256 server-side, and
        stores the file on the configured private Laravel filesystem disk. Default policy:
        JPEG, PNG, WebP, or PDF; maximum 10 MiB. No delete endpoint exists in S3.5.
      security: *auth
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Attachment stored; response includes metadata and new reportVersion/ETag
        '409': { description: Report is not an editable draft }
        '412': { description: Activity Report version conflict }
        '422': { description: File type/size invalid }
        '428': { description: Missing or malformed If-Match }
        '503': { description: Private storage unavailable }

  /activity-reports/{reportId}/attachments/{attachmentId}/download:
    parameters:
      - { name: reportId, in: path, required: true, schema: { type: string, format: ulid } }
      - { name: attachmentId, in: path, required: true, schema: { type: string, format: ulid } }
    get:
      operationId: downloadActivityReportAttachment
      summary: Download one attachment through report authorization
      description: |
        Requires activity-reports.view. Response is private/no-store, nosniff, sandboxed,
        and never exposes the backend storage key. If metadata exists but the file is
        unavailable, the API returns 410 while preserving the evidence metadata.
      security: *auth
      responses:
        '200': { description: Authorized attachment stream }
        '404': { description: Report/attachment missing or outside caller scope }
        '410': { description: Attachment metadata exists but stored file is unavailable }

components:
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }

  schemas:
    ActivityReportType:
      type: string
      enum: [practicum, exam, workshop, general]

    ActivityReportStatus:
      type: string
      enum: [draft, submitted, revision_required, verified]

    ActivityReportOrigin:
      type: string
      enum: [session, manual_backfill]

    ParticipantCount:
      type: [integer, 'null']
      minimum: 0
      maximum: 32767

    CommonContent:
      type: object
      additionalProperties: false
      properties:
        objective: { type: [string, 'null'], maxLength: 8000 }
        material: { type: [string, 'null'], maxLength: 8000 }
        resources: { type: [string, 'null'], maxLength: 8000 }
        issues: { type: [string, 'null'], maxLength: 8000 }
        followUp: { type: [string, 'null'], maxLength: 8000 }
        outcomeReflection: { type: [string, 'null'], maxLength: 8000 }

    TypeSpecificContent:
      type: object
      additionalProperties:
        type: [string, 'null']
        maxLength: 8000

    UpdateActivityReportInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        reportType: { $ref: '#/components/schemas/ActivityReportType' }
        presentCount: { $ref: '#/components/schemas/ParticipantCount' }
        absentCount: { $ref: '#/components/schemas/ParticipantCount' }
        attendanceNotes: { type: [string, 'null'], maxLength: 4000 }
        externalAttendanceSystem: { type: [string, 'null'], maxLength: 128 }
        externalAttendanceReferenceId: { type: [string, 'null'], maxLength: 255 }
        commonContent: { $ref: '#/components/schemas/CommonContent' }
        typeSpecificContent: { $ref: '#/components/schemas/TypeSpecificContent' }

    CreateBackfillInput:
      type: object
      additionalProperties: false
      required: [reportType, laboratoryId, occurredOn, manualBackfillReason, responsibleName, activityDescription]
      properties:
        reportType: { $ref: '#/components/schemas/ActivityReportType' }
        laboratoryId: { type: string, format: ulid }
        occurredOn: { type: string, format: date }
        manualBackfillReason: { type: string, minLength: 1, maxLength: 2000 }
        responsibleName: { type: string, minLength: 1, maxLength: 255 }
        activityDescription: { type: string, minLength: 1, maxLength: 4000 }
        plannedParticipantCount: { $ref: '#/components/schemas/ParticipantCount' }
        presentCount: { $ref: '#/components/schemas/ParticipantCount' }
        absentCount: { $ref: '#/components/schemas/ParticipantCount' }
        attendanceNotes: { type: [string, 'null'], maxLength: 4000 }
        externalAttendanceSystem: { type: [string, 'null'], maxLength: 128 }
        externalAttendanceReferenceId: { type: [string, 'null'], maxLength: 255 }
        commonContent: { $ref: '#/components/schemas/CommonContent' }
        typeSpecificContent: { $ref: '#/components/schemas/TypeSpecificContent' }

    SyncActivityReportDraftInput:
      type: object
      additionalProperties: false
      required: [clientMutationId, baseVersion, patch]
      properties:
        clientMutationId:
          type: string
          format: uuid
          description: Stable identifier reused unchanged when retrying the same local mutation.
        baseVersion:
          type: integer
          minimum: 1
          description: Canonical ActivityReport version from which the local working copy was derived.
        patch:
          allOf:
            - $ref: '#/components/schemas/UpdateActivityReportInput'
          description: Non-empty editable draft fields only. Attachments are intentionally excluded.

    ActivityReportDraftSyncMeta:
      type: object
      additionalProperties: false
      required: [clientMutationId, baseVersion, appliedVersion, replayed]
      properties:
        clientMutationId: { type: string, format: uuid }
        baseVersion: { type: integer, minimum: 1 }
        appliedVersion:
          type: integer
          minimum: 2
          description: Exactly baseVersion + 1 for the stored mutation receipt.
        replayed:
          type: boolean
          description: true when this exact client mutation was previously applied and no new write occurred.

    ReasonInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }

    ActivityReportAttachment:
      type: object
      additionalProperties: false
      required:
        - id
        - reportId
        - storageProvider
        - fileName
        - mediaType
        - sizeBytes
        - sha256
        - available
        - uploadedBy
        - createdAt
      properties:
        id: { type: string, format: ulid }
        reportId: { type: string, format: ulid }
        storageProvider: { type: string }
        fileName: { type: string }
        mediaType: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
        sizeBytes: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        available: { type: boolean }
        uploadedBy:
          type: object
          additionalProperties: false
          required: [userId, membershipId, name]
          properties:
            userId: { type: string }
            membershipId: { type: string }
            name: { type: string }
        createdAt: { type: string, format: date-time }
