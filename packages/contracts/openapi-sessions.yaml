openapi: 3.1.0
info:
  title: SmartLab Laboratory Session API module
  version: 0.23.0
  description: |
    Canonical Laboratory execution contract through S3.5: ownership-safe source discovery,
    source-bound LaboratorySession lifecycle, immutable execution observations, and explicit
    idempotent Observation-to-Incident promotion. Observation creation never auto-creates
    an Incident.
paths:
  /laboratory-session-sources:
    get:
      operationId: listLaboratorySessionSources
      summary: List eligible canonical execution sources
      description: |
        Requires sessions.view. Returns eligible active ScheduleOccurrences, approved
        Laboratory Reservations, and approved Priority Events. scope=mine is resolved
        from canonical membership ownership on the server; schedule ownership uses
        Teacher.membership_id rather than browser display-name inference.
      security: &auth [{ sanctumSession: [] }, { sanctumBearer: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: laboratoryId, in: query, schema: { type: string, format: ulid } }
        - { name: scope, in: query, schema: { type: string, enum: [mine, all] } }
      responses:
        '200': { description: Eligible execution sources with existing Session/report summaries }
        '403': { description: all scope requested without sessions.view-all }
        '422': { description: Invalid or over-wide query window }

  /laboratory-sessions:
    get:
      operationId: listLaboratorySessions
      summary: List canonical Laboratory Sessions
      security: *auth
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: laboratoryId, in: query, schema: { type: string, format: ulid } }
        - { name: sourceType, in: query, schema: { $ref: '#/components/schemas/LaboratorySessionSourceType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/LaboratorySessionStatus' } }
        - { name: scope, in: query, schema: { type: string, enum: [mine, all] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        '200': { description: Paginated canonical Session collection }
        '403': { description: all scope requested without sessions.view-all }
    post:
      operationId: prepareLaboratorySession
      summary: Prepare one execution from a canonical operational source
      description: |
        Requires sessions.prepare. No general manual Session source exists.
        A user without sessions.view-all may prepare only a source owned by the
        current membership.
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrepareLaboratorySessionInput' }
      responses:
        '201': { description: Prepared Session with ETag version }
        '404': { description: Source missing or outside execution scope }
        '409': { description: Source ineligible or already has a non-cancelled Session }
        '422': { description: Validation failed }

  /laboratory-sessions/{sessionId}:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string, format: ulid } }
    get:
      operationId: getLaboratorySession
      security: *auth
      responses:
        '200': { description: Session detail and append-oriented lifecycle timeline }
        '404': { description: Missing, cross-School, or outside caller scope }

  /laboratory-sessions/{sessionId}/start:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string, format: ulid } }
      - $ref: '#/components/parameters/IfMatch'
    post:
      operationId: startLaboratorySession
      summary: Start a prepared Session after fail-closed source and availability revalidation
      security: *auth
      responses:
        '200': { description: Session started and contributes actual occupancy }
        '409': { description: Source changed, source ineligible, wrong execution date, or availability blocked }
        '412': { description: Session version conflict }
        '428': { description: Missing or malformed If-Match }

  /laboratory-sessions/{sessionId}/end:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string, format: ulid } }
      - $ref: '#/components/parameters/IfMatch'
    post:
      operationId: endLaboratorySession
      summary: End an in-progress Session and atomically create/confirm its ActivityReport draft
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EndLaboratorySessionInput' }
      responses:
        '200': { description: Ended Session with associated ActivityReport draft summary }
        '409': { description: Invalid lifecycle state }
        '412': { description: Session version conflict }
        '428': { description: Missing or malformed If-Match }

  /laboratory-sessions/{sessionId}/cancel:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string, format: ulid } }
      - $ref: '#/components/parameters/IfMatch'
    post:
      operationId: cancelLaboratorySession
      summary: Cancel a prepared Session before execution begins
      description: An in-progress Session is ended as interrupted instead of cancelled.
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200': { description: Prepared Session cancelled }
        '409': { description: Invalid lifecycle state }
        '412': { description: Session version conflict }
        '428': { description: Missing or malformed If-Match }

  /laboratory-sessions/{sessionId}/observations:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string, format: ulid } }
    get:
      operationId: listSessionIssueObservations
      summary: List immutable issue observations recorded for one Session
      description: |
        Requires session-observations.view. Users without session-observations.view-all
        are limited to Sessions owned by their current membership.
      security: *auth
      responses:
        '200': { description: Ordered observation evidence collection }
        '404': { description: Session missing, cross-School, or outside caller scope }
    post:
      operationId: createSessionIssueObservation
      summary: Record execution evidence without automatically creating an Incident
      description: |
        Requires session-observations.create. Evidence may be recorded while the Session
        is in_progress, or after end only while the associated ActivityReport remains draft.
        observedAt must fall inside the actual execution window. Device observations require
        an eligible canonical Device in the same Laboratory. S3.5 deliberately refuses a
        canonical Asset reference until the S4 Asset domain exists.
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionIssueObservationInput' }
      responses:
        '201': { description: Immutable observation recorded; no Incident is created }
        '404': { description: Session missing, cross-School, or outside caller scope }
        '409': { description: Observation window is closed or observedAt is outside actual execution }
        '422': { description: Invalid subject/reference or payload }

  /session-observations/{observationId}/promote-incident:
    parameters:
      - { name: observationId, in: path, required: true, schema: { type: string, format: ulid } }
    post:
      operationId: promoteSessionIssueObservationToIncident
      summary: Explicitly create and link one canonical Incident from an observation
      description: |
        Requires both session-observations.promote and incidents.create. Laboratory,
        optional Device, occurredAt, reporter identity, and a stable correlation/submission
        identifier are server-derived from canonical evidence. Retrying an already-linked
        observation returns the same link and cannot create a second Incident.
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromoteObservationInput' }
      responses:
        '200': { description: Observation with exactly one linked Incident summary }
        '403': { description: Required observation/Incident permission is missing }
        '404': { description: Observation missing, cross-School, or outside caller scope }
        '422': { description: Incident classification/content is invalid }

components:
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }

  schemas:
    LaboratorySessionSourceType:
      type: string
      enum: [schedule_occurrence, laboratory_reservation, priority_event]

    LaboratorySessionStatus:
      type: string
      enum: [prepared, in_progress, ended, cancelled]

    PrepareLaboratorySessionInput:
      type: object
      additionalProperties: false
      required: [sourceType, sourceId]
      properties:
        sourceType: { $ref: '#/components/schemas/LaboratorySessionSourceType' }
        sourceId: { type: string, format: ulid }
        openingCondition: { type: [string, 'null'], maxLength: 4000 }
        operationalNotes: { type: [string, 'null'], maxLength: 4000 }

    EndLaboratorySessionInput:
      type: object
      additionalProperties: false
      required: [endOutcome]
      properties:
        endOutcome: { type: string, enum: [completed, interrupted] }
        closingCondition: { type: [string, 'null'], maxLength: 4000 }
        operationalNotes: { type: [string, 'null'], maxLength: 4000 }

    ReasonInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }

    SessionObservationSubjectType:
      type: string
      enum: [device, asset, facility, other]

    SessionObservationSeverity:
      type: string
      enum: [low, medium, high, critical]

    CreateSessionIssueObservationInput:
      type: object
      additionalProperties: false
      required: [subjectType, summary, severity, observedAt]
      properties:
        subjectType: { $ref: '#/components/schemas/SessionObservationSubjectType' }
        referenceId:
          type: [string, 'null']
          description: Required only for subjectType=device. S3.5 rejects references for asset/facility/other.
          maxLength: 128
        summary: { type: string, minLength: 1, maxLength: 4000 }
        severity: { $ref: '#/components/schemas/SessionObservationSeverity' }
        observedAt: { type: string, format: date-time }

    PromoteObservationInput:
      type: object
      additionalProperties: false
      required: [category, priority, title, description, blocksLaboratoryOperation]
      properties:
        category:
          type: string
          enum: [hardware, software, network, electrical, peripheral, facility, cleanliness, security, other]
        priority: { type: string, enum: [low, normal, high, critical] }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 4000 }
        impact: { type: [string, 'null'], maxLength: 2000 }
        blocksLaboratoryOperation: { type: boolean }
        stepsTaken: { type: [string, 'null'], maxLength: 2000 }
