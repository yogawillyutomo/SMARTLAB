openapi: 3.1.0
info:
  title: SmartLab API
  version: 0.5.0
  description: Contract for implemented SmartLab API v1 session authentication, identity, Laboratory, Device, and Layout endpoints.
servers:
  - url: http://localhost:8000/api/v1
    description: Local Laravel API
paths:
  /health:
    get:
      operationId: getHealth
      summary: Read the public SmartLab API health status
      responses:
        '200':
          description: Safe API health response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /me:
    get:
      operationId: getCurrentUser
      summary: Read the authenticated user's current school membership context
      security:
        - sanctumSession: []
        - sanctumBearer: []
      responses:
        '200':
          description: Current user and exactly one active school membership context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: No active membership exists, or school context selection is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/login:
    post:
      operationId: loginSpaSession
      summary: Authenticate the first-party SPA with a Laravel session
      description: After obtaining `/sanctum/csrf-cookie`, submit credentials from a configured Sanctum stateful origin. Successful authentication rotates the session identifier, clears the email-plus-IP throttle, and never issues a personal access token. Unknown email, wrong password, and inactive accounts share one response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaSessionLoginRequest'
      responses:
        '204':
          description: Session authenticated; response has no body
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyLoginAttempts'
  /auth/logout:
    post:
      operationId: logoutSpaSession
      summary: End only the current first-party SPA session
      description: Invalidates the current session, regenerates its CSRF token, and returns no body. It does not revoke personal access tokens, remember tokens for other devices, or other sessions.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      responses:
        '204':
          description: Current session ended; response has no body
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /laboratories:
    get:
      operationId: listLaboratories
      summary: List Laboratories owned by the current school
      description: Requires the `laboratories.view` permission. Results are sorted by code and tenant-scoped to the active membership.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      responses:
        '200':
          description: Current-school Laboratory collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaboratoryCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MembershipContextConflict'
    post:
      operationId: createLaboratory
      summary: Create a Laboratory for the current school
      description: Requires the `laboratories.create` permission. The server derives `schoolId` from the active membership and enforces code uniqueness inside that school.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLaboratoryRequest'
      responses:
        '201':
          description: Laboratory created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaboratoryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MembershipContextConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /laboratories/{laboratoryId}:
    parameters:
      - name: laboratoryId
        in: path
        required: true
        description: Laboratory ULID. Lookups are always scoped to the current school.
        schema:
          type: string
          format: ulid
    get:
      operationId: getLaboratory
      summary: Read one Laboratory owned by the current school
      description: Requires the `laboratories.view` permission. Another school's Laboratory is indistinguishable from a missing Laboratory.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      responses:
        '200':
          description: Current-school Laboratory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaboratoryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/LaboratoryNotFound'
        '409':
          $ref: '#/components/responses/MembershipContextConflict'
    patch:
      operationId: updateLaboratory
      summary: Partially update one Laboratory owned by the current school
      description: Requires the `laboratories.update` permission. At least one mutable field must be supplied; identifiers, tenant ownership, and timestamps are immutable.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLaboratoryRequest'
      responses:
        '200':
          description: Updated Laboratory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaboratoryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/LaboratoryNotFound'
        '409':
          $ref: '#/components/responses/MembershipContextConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /devices:
    get:
      operationId: listDevices
      summary: List Devices owned by the current school
      description: Requires the exact `devices.view` permission. Results are tenant-scoped, paginated, and deterministically ordered by normalized device code then Device ULID. Technical-profile JSON is never searched.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: homeLaboratoryId
          in: query
          description: Same-school canonical Laboratory ULID. Inactive same-school Laboratories remain valid filters; unknown and cross-tenant IDs share one validation response.
          schema:
            type: string
            format: ulid
        - name: deviceType
          in: query
          schema:
            $ref: '#/components/schemas/DeviceType'
        - name: lifecycleStatus
          in: query
          schema:
            $ref: '#/components/schemas/DeviceLifecycleStatus'
        - name: search
          in: query
          description: Case-insensitive literal substring search over deviceCode, hostname, serialNumber, brand, and model only. Percent, underscore, and backslash are treated as literal characters rather than SQL wildcard syntax.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Current-school Device page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MembershipContextConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      operationId: createDevice
      summary: Create a Device for the current school
      description: Requires the exact `devices.create` permission. The server derives school ownership, generates the ULID and opaque QR public ID, initializes both versions to 1, and writes internal Device history atomically.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequest'
      responses:
        '201':
          description: Device created
          headers:
            ETag:
              $ref: '#/components/headers/DeviceETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MembershipContextConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        description: Internal Device ULID. Lookups are always scoped to the current school; this identifier is never a QR payload.
        schema:
          type: string
          format: ulid
    get:
      operationId: getDevice
      summary: Read one Device owned by the current school
      description: Requires the exact `devices.view` permission. Another school's Device is indistinguishable from a missing Device.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      responses:
        '200':
          description: Current-school Device
          headers:
            ETag:
              $ref: '#/components/headers/DeviceETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '409':
          $ref: '#/components/responses/MembershipContextConflict'
    patch:
      operationId: updateDevice
      summary: Update mutable Device v1 fields with optimistic concurrency
      description: Requires the exact `devices.update` permission and a strong If-Match value equal to the current Device version, including for an effective no-op. Technical profile is atomically replaced, home Laboratory permits initial assignment only, and generic lifecycle updates permit only in_service and spare. An effective mutation increments version once and emits a new ETag; an effective no-op returns 200 with the existing version, ETag, updatedAt, and no history event.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - name: If-Match
          in: header
          required: true
          description: Strong quoted positive integer equal to the Device DTO version, for example `"1"`. Weak, wildcard, unquoted, multiple, and malformed validators are rejected.
          schema:
            type: string
            pattern: '^"[1-9][0-9]*"$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceRequest'
      responses:
        '200':
          description: Canonical Device after PATCH. An effective mutation increments version exactly once; an effective no-op preserves version and ETag. Both require a matching If-Match precondition.
          headers:
            ETag:
              $ref: '#/components/headers/DeviceETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '409':
          $ref: '#/components/responses/DevicePatchConflict'
        '412':
          $ref: '#/components/responses/DeviceVersionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /laboratories/{laboratoryId}/layouts:
    parameters:
      - name: laboratoryId
        in: path
        required: true
        description: Laboratory ULID resolved inside the current School.
        schema: { type: string, format: ulid }
    get:
      operationId: listLaboratoryLayouts
      summary: List Layout summaries for one Laboratory
      description: Requires `layouts.view`. Results are tenant-scoped and ordered by createdAt descending, then Layout ULID ascending.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/LayoutStatus' }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Current-School Layout summary page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutSummaryCollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/LaboratoryNotFound' }
        '409': { $ref: '#/components/responses/MembershipContextConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createLaboratoryLayoutDraft
      summary: Create the Laboratory's sole draft Layout
      description: Requires `layouts.create`. When an active Layout exists, the server clones its complete aggregate with new root and child ULIDs and accepts only an optional name override. Otherwise name, rows, and columns are required and an empty sparse draft is created.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLayoutRequest' }
      responses:
        '201':
          description: Draft Layout created
          headers:
            ETag: { $ref: '#/components/headers/LayoutETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/LaboratoryNotFound' }
        '409': { $ref: '#/components/responses/LayoutConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /layouts/{layoutId}:
    parameters:
      - name: layoutId
        in: path
        required: true
        description: Layout ULID resolved inside the current School.
        schema: { type: string, format: ulid }
    get:
      operationId: getLayout
      summary: Read a canonical full Layout aggregate
      description: Requires `layouts.view`. Draft, active, and archived Layouts are readable. Child collections are deterministically ordered by row, column, then child ULID.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      responses:
        '200':
          description: Canonical Layout aggregate
          headers:
            ETag: { $ref: '#/components/headers/LayoutETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/LayoutNotFound' }
        '409': { $ref: '#/components/responses/MembershipContextConflict' }
    put:
      operationId: replaceLayoutDraft
      summary: Atomically replace the complete mutable draft aggregate
      description: Requires `layouts.update` and exactly one strong quoted positive-integer If-Match value. Active and archived Layouts are immutable. Canonically equivalent normalized input is an effective no-op that preserves version, ETag, updatedAt, and history. A syntactically valid but stale version returns 412; missing or malformed input returns 428.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/LayoutIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceLayoutRequest' }
      responses:
        '200':
          description: Canonical saved or unchanged draft Layout
          headers:
            ETag: { $ref: '#/components/headers/LayoutETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/LayoutNotFound' }
        '409': { $ref: '#/components/responses/LayoutConflict' }
        '412': { $ref: '#/components/responses/LayoutVersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/LayoutPreconditionRequired' }
    delete:
      operationId: deleteLayoutDraft
      summary: Delete a draft Layout and its children
      description: Requires `layouts.delete` and exact If-Match. Draft cleanup remains allowed when the Laboratory is inactive; active and archived Layouts cannot be deleted. Internal audit history survives with snapshot identifiers.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/LayoutIfMatch'
      responses:
        '204': { description: Draft Layout deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/LayoutNotFound' }
        '409': { $ref: '#/components/responses/LayoutConflict' }
        '412': { $ref: '#/components/responses/LayoutVersionConflict' }
        '428': { $ref: '#/components/responses/LayoutPreconditionRequired' }
  /layouts/{layoutId}/activate:
    parameters:
      - name: layoutId
        in: path
        required: true
        schema: { type: string, format: ulid }
    post:
      operationId: activateLayoutDraft
      summary: Activate a draft and atomically archive its predecessor
      description: Requires `layouts.update` and exact If-Match. The request body must be empty. The complete aggregate and current Device eligibility are revalidated under locks; the new active Layout and predecessor each increment version exactly once with one effective timestamp.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/LayoutIfMatch'
      responses:
        '200':
          description: Newly active Layout
          headers:
            ETag: { $ref: '#/components/headers/LayoutETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/LayoutNotFound' }
        '409': { $ref: '#/components/responses/LayoutConflict' }
        '412': { $ref: '#/components/responses/LayoutVersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/LayoutPreconditionRequired' }
  /layouts/{layoutId}/unplaced-devices:
    parameters:
      - name: layoutId
        in: path
        required: true
        schema: { type: string, format: ulid }
    get:
      operationId: listUnplacedLayoutDevices
      summary: List eligible Devices unplaced relative to this Layout
      description: Requires both `layouts.view` and `devices.view`. Only draft or active Layouts are accepted. The server selects current-School, matching-home, in-service or spare Devices absent from this specific Layout.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: search
          in: query
          description: Literal case-insensitive substring search over deviceCode, hostname, serialNumber, brand, and model only.
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Unplaced Device candidate page ordered by deviceCode then Device ULID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnplacedDeviceCollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/LayoutNotFound' }
        '409': { $ref: '#/components/responses/LayoutConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
components:
  securitySchemes:
    sanctumSession:
      type: apiKey
      in: cookie
      name: smartlab-api-session
      description: Browser-managed Laravel session cookie for the first-party stateful SPA. This is the local default derived from APP_NAME; deployments may configure SESSION_COOKIE, so the cookie name is not a stable production contract.
    sanctumBearer:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Sanctum personal access token for mobile or API token clients.
  parameters:
    LayoutIfMatch:
      name: If-Match
      in: header
      required: true
      description: Exactly one strong quoted positive integer equal to the Layout version, for example `"1"`. Missing, weak, wildcard, unquoted, multiple, whitespace-padded, zero, negative, and malformed values return 428. A valid but stale value returns 412.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
  responses:
    Unauthenticated:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Authentication is required.
            code: UNAUTHENTICATED
    Forbidden:
      description: The active membership lacks the endpoint permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    LaboratoryNotFound:
      description: No Laboratory exists in the current school with this identifier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    DeviceNotFound:
      description: No Device exists in the current school with this identifier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Device not found.
            code: DEVICE_NOT_FOUND
    LayoutNotFound:
      description: No Layout exists in the current School with this identifier
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            message: Layout not found.
            code: LAYOUT_NOT_FOUND
    LayoutConflict:
      description: The Layout operation violates lifecycle, Laboratory, Device-placement, or geometry invariants
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            draftExists: { value: { message: A draft Layout already exists for this Laboratory., code: LAYOUT_DRAFT_ALREADY_EXISTS } }
            status: { value: { message: The requested operation is valid only for a draft Layout., code: LAYOUT_STATUS_CONFLICT } }
            inactive: { value: { message: The Laboratory must be active for this Layout operation., code: LAYOUT_LABORATORY_INACTIVE } }
            duplicateDevice: { value: { message: A Device may be placed only once in a Layout., code: LAYOUT_DEVICE_ALREADY_PLACED } }
            homeMismatch: { value: { message: The Device home Laboratory does not match this Layout., code: LAYOUT_DEVICE_HOME_MISMATCH } }
            ineligibleDevice: { value: { message: The Device lifecycle is not eligible for Layout placement., code: LAYOUT_DEVICE_NOT_ELIGIBLE } }
            occupied: { value: { message: Two Layout footprints occupy the same position., code: LAYOUT_POSITION_OCCUPIED } }
    LayoutPreconditionRequired:
      description: A Layout mutation is missing the exact strong quoted positive-integer If-Match precondition or supplies a malformed form
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            message: A valid If-Match Layout version is required.
            code: PRECONDITION_REQUIRED
    LayoutVersionConflict:
      description: The supplied syntactically valid Layout version is stale
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            message: Layout has changed since it was loaded.
            code: LAYOUT_VERSION_CONFLICT
    PreconditionRequired:
      description: PATCH is missing an exact strong Device version precondition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: A valid If-Match Device version is required.
            code: PRECONDITION_REQUIRED
    DeviceVersionConflict:
      description: The supplied valid Device version is stale
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Device has changed since it was loaded.
            code: DEVICE_VERSION_CONFLICT
    DevicePatchConflict:
      description: Membership context is unresolved, an established home Laboratory change requires Transfer, or a terminal Device lifecycle cannot be changed by generic PATCH
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            transferRequired:
              value:
                message: Established Device home Laboratory changes require the Device Transfer domain.
                code: DEVICE_HOME_LABORATORY_TRANSFER_REQUIRED
            lifecycleInvalid:
              value:
                message: The requested Device lifecycle transition is invalid.
                code: DEVICE_LIFECYCLE_TRANSITION_INVALID
    MembershipContextConflict:
      description: No active membership exists, or school context selection is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ValidationFailed:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    InvalidCredentials:
      description: Credentials are invalid or the account is inactive
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: The provided credentials are invalid.
            code: INVALID_CREDENTIALS
    TooManyLoginAttempts:
      description: The email-plus-IP login limit has been exceeded; a Retry-After header is returned
      headers:
        Retry-After:
          description: Seconds until another login attempt may be made
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Too many login attempts. Please try again later.
            code: TOO_MANY_LOGIN_ATTEMPTS
  headers:
    DeviceETag:
      description: Strong entity tag whose quoted positive integer exactly matches `data.version`.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
      example: '"1"'
    LayoutETag:
      description: Strong entity tag whose quoted positive integer exactly matches `data.version`.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
      example: '"1"'
  schemas:
    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, service]
          properties:
            status:
              type: string
              const: ok
            service:
              type: string
              const: smartlab-api
    CurrentUserResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CurrentUser'
    CurrentUser:
      type: object
      required: [id, name, email, school, membership, permissions]
      properties:
        id:
          type: string
          format: ulid
        name:
          type: string
        email:
          type: string
          format: email
        school:
          $ref: '#/components/schemas/SchoolContext'
        membership:
          $ref: '#/components/schemas/MembershipContext'
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z-]+\.[a-z]+$'
    SchoolContext:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: ulid
        code:
          type: string
        name:
          type: string
    MembershipContext:
      type: object
      required: [id, status, roles]
      properties:
        id:
          type: string
          format: ulid
        status:
          type: string
          enum: [active]
        roles:
          type: array
          items:
            type: string
    SpaSessionLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          maxLength: 4096
        remember:
          type: boolean
          default: false
    LaboratoryCollectionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Laboratory'
    LaboratoryResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Laboratory'
    Laboratory:
      type: object
      required: [id, schoolId, code, name, location, capacity, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: ulid
        schoolId:
          type: string
          format: ulid
          readOnly: true
          description: Owning school derived from the active membership context.
        code:
          type: string
          maxLength: 50
          description: Unique only within the owning school.
        name:
          type: string
          maxLength: 255
        location:
          type: string
          maxLength: 255
        capacity:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    CreateLaboratoryRequest:
      type: object
      additionalProperties: false
      required: [code, name, location, capacity]
      properties:
        code:
          type: string
          maxLength: 50
          description: Must be unique inside the current school.
        name:
          type: string
          maxLength: 255
        location:
          type: string
          maxLength: 255
        capacity:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, inactive]
          default: active
    UpdateLaboratoryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        code:
          type: string
          maxLength: 50
          description: Must be unique inside the current school.
        name:
          type: string
          maxLength: 255
        location:
          type: string
          maxLength: 255
        capacity:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, inactive]
    DeviceType:
      type: string
      enum: [desktop_pc, laptop, server, network_switch, router, access_point, printer, projector, ups, other]
    DeviceLifecycleStatus:
      type: string
      enum: [in_service, spare, retired, decommissioned]
    DeviceCollectionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        meta:
          $ref: '#/components/schemas/DevicePaginationMeta'
    DevicePaginationMeta:
      type: object
      additionalProperties: false
      required: [page, perPage, total, lastPage]
      properties:
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        lastPage:
          type: integer
          minimum: 1
    DeviceResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Device'
    Device:
      type: object
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/DeviceTypeProfileConstraint'
      required: [id, schoolId, deviceCode, qrPublicId, deviceType, lifecycleStatus, homeLaboratoryId, serialNumber, hostname, brand, model, technicalProfileVersion, technicalProfile, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: ulid
          readOnly: true
        schoolId:
          type: string
          format: ulid
          readOnly: true
          description: Owning School derived from the active membership; never client-selectable.
        deviceCode:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9-]{2,31}$'
          minLength: 3
          maxLength: 32
          description: Canonical uppercase, location-neutral, and unique inside the School.
        qrPublicId:
          type: string
          pattern: '^devq_[A-Za-z0-9_-]{22}$'
          readOnly: true
          description: Server-generated opaque identifier containing 128 random bits; never authorization.
        deviceType:
          $ref: '#/components/schemas/DeviceType'
        lifecycleStatus:
          $ref: '#/components/schemas/DeviceLifecycleStatus'
        homeLaboratoryId:
          type: [string, 'null']
          format: ulid
          description: Nullable canonical home/custodial Laboratory, not current physical location.
        serialNumber:
          type: [string, 'null']
          maxLength: 255
        hostname:
          type: [string, 'null']
          maxLength: 255
        brand:
          type: [string, 'null']
          maxLength: 255
        model:
          type: [string, 'null']
          maxLength: 255
        technicalProfileVersion:
          type: integer
          minimum: 1
          readOnly: true
        technicalProfile:
          $ref: '#/components/schemas/DeviceTechnicalProfile'
        version:
          type: integer
          minimum: 1
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    CreateDeviceRequest:
      type: object
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/DeviceTypeProfileConstraint'
      required: [deviceCode, deviceType]
      properties:
        deviceCode:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9-]{2,31}$'
          minLength: 3
          maxLength: 32
          description: Trimmed and uppercased by the server before validation.
        deviceType:
          $ref: '#/components/schemas/DeviceType'
        homeLaboratoryId:
          type: [string, 'null']
          format: ulid
          description: When supplied, must reference an active Laboratory in the current School.
        lifecycleStatus:
          type: string
          enum: [in_service, spare]
          default: in_service
        serialNumber:
          type: [string, 'null']
          maxLength: 255
        hostname:
          type: [string, 'null']
          maxLength: 255
        brand:
          type: [string, 'null']
          maxLength: 255
        model:
          type: [string, 'null']
          maxLength: 255
        technicalProfile:
          allOf:
            - $ref: '#/components/schemas/DeviceTechnicalProfile'
          default: {}
          description: Complete type-specific JSON object selected by root deviceType; kind and schemaVersion are prohibited.
    UpdateDeviceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        serialNumber:
          type: [string, 'null']
          maxLength: 255
        hostname:
          type: [string, 'null']
          maxLength: 255
        brand:
          type: [string, 'null']
          maxLength: 255
        model:
          type: [string, 'null']
          maxLength: 255
        homeLaboratoryId:
          type: [string, 'null']
          format: ulid
          description: Generic PATCH permits null-to-active-same-School initial assignment or same-value no-op only.
        technicalProfile:
          $ref: '#/components/schemas/DeviceTechnicalProfile'
          description: Complete atomic replacement validated against the immutable stored deviceType; never merged.
        lifecycleStatus:
          type: string
          enum: [in_service, spare]
    DeviceTechnicalProfile:
      description: Type-specific JSON object. Root deviceType is the only discriminator. The server enforces a serialized maximum of 16 KiB and exact type/profile correspondence.
      anyOf:
        - $ref: '#/components/schemas/DesktopPcTechnicalProfile'
        - $ref: '#/components/schemas/LaptopTechnicalProfile'
        - $ref: '#/components/schemas/ServerTechnicalProfile'
        - $ref: '#/components/schemas/NetworkSwitchTechnicalProfile'
        - $ref: '#/components/schemas/RouterTechnicalProfile'
        - $ref: '#/components/schemas/AccessPointTechnicalProfile'
        - $ref: '#/components/schemas/PrinterTechnicalProfile'
        - $ref: '#/components/schemas/ProjectorTechnicalProfile'
        - $ref: '#/components/schemas/UpsTechnicalProfile'
        - $ref: '#/components/schemas/OtherTechnicalProfile'
    DeviceTypeProfileConstraint:
      description: Correlates the immutable root deviceType discriminator with its exact technicalProfile schema. An omitted create profile defaults to the matching empty object.
      oneOf:
        - type: object
          required: [deviceType]
          properties:
            deviceType: { const: desktop_pc }
            technicalProfile: { $ref: '#/components/schemas/DesktopPcTechnicalProfile' }
        - type: object
          required: [deviceType]
          properties:
            deviceType: { const: laptop }
            technicalProfile: { $ref: '#/components/schemas/LaptopTechnicalProfile' }
        - type: object
          required: [deviceType]
          properties:
            deviceType: { const: server }
            technicalProfile: { $ref: '#/components/schemas/ServerTechnicalProfile' }
        - type: object
          required: [deviceType]
          properties:
            deviceType: { const: network_switch }
            technicalProfile: { $ref: '#/components/schemas/NetworkSwitchTechnicalProfile' }
        - type: object
          required: [deviceType]
          properties:
            deviceType: { const: router }
            technicalProfile: { $ref: '#/components/schemas/RouterTechnicalProfile' }
        - type: object
          required: [deviceType]
          properties:
            deviceType: { const: access_point }
            technicalProfile: { $ref: '#/components/schemas/AccessPointTechnicalProfile' }
        - type: object
          required: [deviceType]
          properties:
            deviceType: { const: printer }
            technicalProfile: { $ref: '#/components/schemas/PrinterTechnicalProfile' }
        - type: object
          required: [deviceType]
          properties:
            deviceType: { const: projector }
            technicalProfile: { $ref: '#/components/schemas/ProjectorTechnicalProfile' }
        - type: object
          required: [deviceType]
          properties:
            deviceType: { const: ups }
            technicalProfile: { $ref: '#/components/schemas/UpsTechnicalProfile' }
        - type: object
          required: [deviceType]
          properties:
            deviceType: { const: other }
            technicalProfile: { $ref: '#/components/schemas/OtherTechnicalProfile' }
    DesktopPcTechnicalProfile:
      type: object
      additionalProperties: false
      properties:
        processor: { type: string, maxLength: 255 }
        ramGB: { type: number, exclusiveMinimum: 0 }
        storageGB: { type: number, exclusiveMinimum: 0 }
        gpu: { type: string, maxLength: 255 }
        os: { type: string, maxLength: 255 }
    LaptopTechnicalProfile:
      type: object
      additionalProperties: false
      properties:
        processor: { type: string, maxLength: 255 }
        ramGB: { type: number, exclusiveMinimum: 0 }
        storageGB: { type: number, exclusiveMinimum: 0 }
        gpu: { type: string, maxLength: 255 }
        os: { type: string, maxLength: 255 }
        display: { type: string, maxLength: 255 }
    ServerTechnicalProfile:
      type: object
      additionalProperties: false
      properties:
        processor: { type: string, maxLength: 255 }
        cpuSockets: { type: integer, minimum: 1 }
        cpuCores: { type: integer, minimum: 1 }
        ramGB: { type: number, exclusiveMinimum: 0 }
        storageGB: { type: number, exclusiveMinimum: 0 }
        raidLevel: { type: string, maxLength: 255 }
        os: { type: string, maxLength: 255 }
    NetworkSwitchTechnicalProfile:
      type: object
      additionalProperties: false
      properties:
        portCount: { type: integer, minimum: 1 }
        managed: { type: boolean }
        poe: { type: boolean }
        poeBudgetWatts: { type: number, minimum: 0 }
        switchingCapacityGbps: { type: number, minimum: 0 }
        uplinkSpeedGbps: { type: number, minimum: 0 }
        firmwareVersion: { type: string, maxLength: 255 }
    RouterTechnicalProfile:
      type: object
      additionalProperties: false
      properties:
        wanPortCount: { type: integer, minimum: 0 }
        lanPortCount: { type: integer, minimum: 0 }
        throughputMbps: { type: number, minimum: 0 }
        wifiCapable: { type: boolean }
        firmwareVersion: { type: string, maxLength: 255 }
    AccessPointTechnicalProfile:
      type: object
      additionalProperties: false
      properties:
        wifiStandard: { type: string, maxLength: 255 }
        bands:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [2.4GHz, 5GHz, 6GHz]
        maxClients: { type: integer, minimum: 0 }
        poe: { type: boolean }
        firmwareVersion: { type: string, maxLength: 255 }
    PrinterTechnicalProfile:
      type: object
      additionalProperties: false
      properties:
        technology:
          type: string
          enum: [inkjet, laser, dot_matrix, thermal, other]
        color: { type: boolean }
        duplex: { type: boolean }
        networkCapable: { type: boolean }
        paperSize: { type: string, maxLength: 255 }
    ProjectorTechnicalProfile:
      type: object
      additionalProperties: false
      properties:
        technology: { type: string, maxLength: 255 }
        brightnessLumens: { type: number, minimum: 0 }
        nativeResolution: { type: string, maxLength: 255 }
    UpsTechnicalProfile:
      type: object
      additionalProperties: false
      properties:
        capacityVA: { type: number, minimum: 0 }
        powerWatts: { type: number, minimum: 0 }
        batteryCount: { type: integer, minimum: 0 }
        batteryVoltage: { type: number, minimum: 0 }
        runtimeMinutes: { type: number, minimum: 0 }
    OtherTechnicalProfile:
      type: object
      maxProperties: 32
      propertyNames:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z][A-Za-z0-9_.-]*$'
      additionalProperties:
        anyOf:
          - type: string
            maxLength: 500
          - type: number
          - type: boolean
          - type: 'null'
    LayoutStatus:
      type: string
      enum: [draft, active, archived]
    StructuralLayoutElementType:
      type: string
      enum: [teacher_desk, door, window, wall, aisle, label]
    DevicePlacementRole:
      type: [string, 'null']
      enum: [student_station, teacher_station, null]
    LayoutRotation:
      type: integer
      enum: [0, 90, 180, 270]
    LayoutPaginationMeta:
      type: object
      additionalProperties: false
      required: [page, perPage, total, lastPage]
      properties:
        page: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        lastPage: { type: integer, minimum: 1 }
    LayoutSummaryCollectionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LayoutSummary' }
        meta: { $ref: '#/components/schemas/LayoutPaginationMeta' }
    LayoutResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Layout' }
    LayoutSummary:
      type: object
      additionalProperties: false
      required: [id, schoolId, laboratoryId, name, templateKey, rows, columns, status, version, activatedAt, archivedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: ulid, readOnly: true }
        schoolId: { type: string, format: ulid, readOnly: true }
        laboratoryId: { type: string, format: ulid, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 255 }
        templateKey:
          type: [string, 'null']
          maxLength: 100
          description: Frontend template provenance only; not a backend geometry mode.
        rows: { type: integer, minimum: 1, maximum: 50 }
        columns: { type: integer, minimum: 1, maximum: 50 }
        status: { $ref: '#/components/schemas/LayoutStatus' }
        version: { type: integer, minimum: 1, readOnly: true }
        activatedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        archivedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
    Layout:
      type: object
      additionalProperties: false
      required: [id, schoolId, laboratoryId, name, templateKey, rows, columns, status, version, structuralElements, devicePlacements, activatedAt, archivedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: ulid, readOnly: true }
        schoolId: { type: string, format: ulid, readOnly: true }
        laboratoryId: { type: string, format: ulid, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 255 }
        templateKey: { type: [string, 'null'], maxLength: 100 }
        rows: { type: integer, minimum: 1, maximum: 50 }
        columns: { type: integer, minimum: 1, maximum: 50 }
        status: { $ref: '#/components/schemas/LayoutStatus' }
        version: { type: integer, minimum: 1, readOnly: true }
        structuralElements:
          type: array
          maxItems: 2500
          items: { $ref: '#/components/schemas/StructuralLayoutElement' }
        devicePlacements:
          type: array
          maxItems: 2500
          items: { $ref: '#/components/schemas/DevicePlacement' }
        activatedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        archivedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
    StructuralLayoutElement:
      type: object
      additionalProperties: false
      required: [id, type, label, row, column, rowSpan, columnSpan, rotation]
      properties:
        id: { type: string, format: ulid, readOnly: true }
        type: { $ref: '#/components/schemas/StructuralLayoutElementType' }
        label: { type: [string, 'null'], maxLength: 60 }
        row: { type: integer, minimum: 1 }
        column: { type: integer, minimum: 1 }
        rowSpan: { type: integer, minimum: 1 }
        columnSpan: { type: integer, minimum: 1 }
        rotation: { $ref: '#/components/schemas/LayoutRotation' }
    StructuralLayoutElementInput:
      type: object
      additionalProperties: false
      required: [type, row, column, rowSpan, columnSpan, rotation]
      properties:
        id:
          type: string
          format: ulid
          description: Existing child ID belonging to this exact draft. New children omit this property; explicit null is invalid.
        type: { $ref: '#/components/schemas/StructuralLayoutElementType' }
        label:
          type: [string, 'null']
          maxLength: 60
          description: Required nonblank text for type label, forbidden/nonblank-null for aisle, optional for other structural types.
        row: { type: integer, minimum: 1 }
        column: { type: integer, minimum: 1 }
        rowSpan: { type: integer, minimum: 1 }
        columnSpan: { type: integer, minimum: 1 }
        rotation: { $ref: '#/components/schemas/LayoutRotation' }
    DevicePlacement:
      type: object
      additionalProperties: false
      required: [id, deviceId, role, label, row, column, rowSpan, columnSpan, rotation]
      properties:
        id: { type: string, format: ulid, readOnly: true }
        deviceId: { type: string, format: ulid }
        role: { $ref: '#/components/schemas/DevicePlacementRole' }
        label: { type: [string, 'null'], maxLength: 60 }
        row: { type: integer, minimum: 1 }
        column: { type: integer, minimum: 1 }
        rowSpan: { type: integer, minimum: 1 }
        columnSpan: { type: integer, minimum: 1 }
        rotation: { $ref: '#/components/schemas/LayoutRotation' }
    DevicePlacementInput:
      type: object
      additionalProperties: false
      required: [deviceId, row, column, rowSpan, columnSpan, rotation]
      properties:
        id:
          type: string
          format: ulid
          description: Existing child ID belonging to this exact draft. New children omit this property; explicit null is invalid.
        deviceId: { type: string, format: ulid }
        role: { $ref: '#/components/schemas/DevicePlacementRole' }
        label: { type: [string, 'null'], maxLength: 60 }
        row: { type: integer, minimum: 1 }
        column: { type: integer, minimum: 1 }
        rowSpan: { type: integer, minimum: 1 }
        columnSpan: { type: integer, minimum: 1 }
        rotation: { $ref: '#/components/schemas/LayoutRotation' }
    CreateLayoutRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Required when there is no active Layout; optional override when cloning.
        templateKey:
          type: [string, 'null']
          maxLength: 100
          description: Optional only when there is no active Layout; rejected for clone creation.
        rows:
          type: integer
          minimum: 1
          maximum: 50
          description: Required only when there is no active Layout; rejected for clone creation.
        columns:
          type: integer
          minimum: 1
          maximum: 50
          description: Required only when there is no active Layout; rejected for clone creation.
    ReplaceLayoutRequest:
      type: object
      additionalProperties: false
      required: [name, templateKey, rows, columns, structuralElements, devicePlacements]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        templateKey: { type: [string, 'null'], maxLength: 100 }
        rows: { type: integer, minimum: 1, maximum: 50 }
        columns: { type: integer, minimum: 1, maximum: 50 }
        structuralElements:
          type: array
          maxItems: 2500
          items: { $ref: '#/components/schemas/StructuralLayoutElementInput' }
        devicePlacements:
          type: array
          maxItems: 2500
          items: { $ref: '#/components/schemas/DevicePlacementInput' }
    UnplacedDeviceCandidate:
      type: object
      additionalProperties: false
      required: [id, deviceCode, deviceType, lifecycleStatus, hostname, brand, model]
      properties:
        id: { type: string, format: ulid }
        deviceCode: { type: string, minLength: 3, maxLength: 32 }
        deviceType: { $ref: '#/components/schemas/DeviceType' }
        lifecycleStatus:
          type: string
          enum: [in_service, spare]
        hostname: { type: [string, 'null'], maxLength: 255 }
        brand: { type: [string, 'null'], maxLength: 255 }
        model: { type: [string, 'null'], maxLength: 255 }
    UnplacedDeviceCollectionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/UnplacedDeviceCandidate' }
        meta: { $ref: '#/components/schemas/LayoutPaginationMeta' }
    ApiError:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
        code:
          type: string
          enum: [UNAUTHENTICATED, INVALID_CREDENTIALS, TOO_MANY_LOGIN_ATTEMPTS, ACTIVE_MEMBERSHIP_REQUIRED, SCHOOL_CONTEXT_REQUIRED, FORBIDDEN, LABORATORY_NOT_FOUND, DEVICE_NOT_FOUND, LAYOUT_NOT_FOUND, PRECONDITION_REQUIRED, DEVICE_VERSION_CONFLICT, LAYOUT_VERSION_CONFLICT, DEVICE_HOME_LABORATORY_TRANSFER_REQUIRED, DEVICE_LIFECYCLE_TRANSITION_INVALID, LAYOUT_DRAFT_ALREADY_EXISTS, LAYOUT_STATUS_CONFLICT, LAYOUT_LABORATORY_INACTIVE, LAYOUT_DEVICE_ALREADY_PLACED, LAYOUT_DEVICE_HOME_MISMATCH, LAYOUT_DEVICE_NOT_ELIGIBLE, LAYOUT_POSITION_OCCUPIED]
    ValidationError:
      type: object
      required: [message, code, errors]
      properties:
        message:
          type: string
        code:
          type: string
          const: VALIDATION_FAILED
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
