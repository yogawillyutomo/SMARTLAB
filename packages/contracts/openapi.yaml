openapi: 3.1.0
info:
  title: SmartLab API
  version: 0.3.0
  description: Contract for implemented SmartLab API v1 session authentication, identity, and Laboratory endpoints.
servers:
  - url: http://localhost:8000/api/v1
    description: Local Laravel API
paths:
  /health:
    get:
      operationId: getHealth
      summary: Read the public SmartLab API health status
      responses:
        '200':
          description: Safe API health response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /me:
    get:
      operationId: getCurrentUser
      summary: Read the authenticated user's current school membership context
      security:
        - sanctumSession: []
        - sanctumBearer: []
      responses:
        '200':
          description: Current user and exactly one active school membership context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: No active membership exists, or school context selection is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/login:
    post:
      operationId: loginSpaSession
      summary: Authenticate the first-party SPA with a Laravel session
      description: After obtaining `/sanctum/csrf-cookie`, submit credentials from a configured Sanctum stateful origin. Successful authentication rotates the session identifier, clears the email-plus-IP throttle, and never issues a personal access token. Unknown email, wrong password, and inactive accounts share one response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaSessionLoginRequest'
      responses:
        '204':
          description: Session authenticated; response has no body
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyLoginAttempts'
  /auth/logout:
    post:
      operationId: logoutSpaSession
      summary: End only the current first-party SPA session
      description: Invalidates the current session, regenerates its CSRF token, and returns no body. It does not revoke personal access tokens, remember tokens for other devices, or other sessions.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      responses:
        '204':
          description: Current session ended; response has no body
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /laboratories:
    get:
      operationId: listLaboratories
      summary: List Laboratories owned by the current school
      description: Requires the `laboratories.view` permission. Results are sorted by code and tenant-scoped to the active membership.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      responses:
        '200':
          description: Current-school Laboratory collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaboratoryCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MembershipContextConflict'
    post:
      operationId: createLaboratory
      summary: Create a Laboratory for the current school
      description: Requires the `laboratories.create` permission. The server derives `schoolId` from the active membership and enforces code uniqueness inside that school.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLaboratoryRequest'
      responses:
        '201':
          description: Laboratory created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaboratoryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MembershipContextConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /laboratories/{laboratoryId}:
    parameters:
      - name: laboratoryId
        in: path
        required: true
        description: Laboratory ULID. Lookups are always scoped to the current school.
        schema:
          type: string
          format: ulid
    get:
      operationId: getLaboratory
      summary: Read one Laboratory owned by the current school
      description: Requires the `laboratories.view` permission. Another school's Laboratory is indistinguishable from a missing Laboratory.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      responses:
        '200':
          description: Current-school Laboratory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaboratoryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/LaboratoryNotFound'
        '409':
          $ref: '#/components/responses/MembershipContextConflict'
    patch:
      operationId: updateLaboratory
      summary: Partially update one Laboratory owned by the current school
      description: Requires the `laboratories.update` permission. At least one mutable field must be supplied; identifiers, tenant ownership, and timestamps are immutable.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLaboratoryRequest'
      responses:
        '200':
          description: Updated Laboratory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaboratoryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/LaboratoryNotFound'
        '409':
          $ref: '#/components/responses/MembershipContextConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
components:
  securitySchemes:
    sanctumSession:
      type: apiKey
      in: cookie
      name: smartlab-api-session
      description: Browser-managed Laravel session cookie for the first-party stateful SPA. This is the local default derived from APP_NAME; deployments may configure SESSION_COOKIE, so the cookie name is not a stable production contract.
    sanctumBearer:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Sanctum personal access token for mobile or API token clients.
  responses:
    Unauthenticated:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Authentication is required.
            code: UNAUTHENTICATED
    Forbidden:
      description: The active membership lacks the endpoint permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    LaboratoryNotFound:
      description: No Laboratory exists in the current school with this identifier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    MembershipContextConflict:
      description: No active membership exists, or school context selection is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ValidationFailed:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    InvalidCredentials:
      description: Credentials are invalid or the account is inactive
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: The provided credentials are invalid.
            code: INVALID_CREDENTIALS
    TooManyLoginAttempts:
      description: The email-plus-IP login limit has been exceeded; a Retry-After header is returned
      headers:
        Retry-After:
          description: Seconds until another login attempt may be made
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Too many login attempts. Please try again later.
            code: TOO_MANY_LOGIN_ATTEMPTS
  schemas:
    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, service]
          properties:
            status:
              type: string
              const: ok
            service:
              type: string
              const: smartlab-api
    CurrentUserResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CurrentUser'
    CurrentUser:
      type: object
      required: [id, name, email, school, membership, permissions]
      properties:
        id:
          type: string
          format: ulid
        name:
          type: string
        email:
          type: string
          format: email
        school:
          $ref: '#/components/schemas/SchoolContext'
        membership:
          $ref: '#/components/schemas/MembershipContext'
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z-]+\.[a-z]+$'
    SchoolContext:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: ulid
        code:
          type: string
        name:
          type: string
    MembershipContext:
      type: object
      required: [id, status, roles]
      properties:
        id:
          type: string
          format: ulid
        status:
          type: string
          enum: [active]
        roles:
          type: array
          items:
            type: string
    SpaSessionLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          maxLength: 4096
        remember:
          type: boolean
          default: false
    LaboratoryCollectionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Laboratory'
    LaboratoryResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Laboratory'
    Laboratory:
      type: object
      required: [id, schoolId, code, name, location, capacity, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: ulid
        schoolId:
          type: string
          format: ulid
          readOnly: true
          description: Owning school derived from the active membership context.
        code:
          type: string
          maxLength: 50
          description: Unique only within the owning school.
        name:
          type: string
          maxLength: 255
        location:
          type: string
          maxLength: 255
        capacity:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    CreateLaboratoryRequest:
      type: object
      additionalProperties: false
      required: [code, name, location, capacity]
      properties:
        code:
          type: string
          maxLength: 50
          description: Must be unique inside the current school.
        name:
          type: string
          maxLength: 255
        location:
          type: string
          maxLength: 255
        capacity:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, inactive]
          default: active
    UpdateLaboratoryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        code:
          type: string
          maxLength: 50
          description: Must be unique inside the current school.
        name:
          type: string
          maxLength: 255
        location:
          type: string
          maxLength: 255
        capacity:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, inactive]
    ApiError:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
        code:
          type: string
          enum: [UNAUTHENTICATED, INVALID_CREDENTIALS, TOO_MANY_LOGIN_ATTEMPTS, ACTIVE_MEMBERSHIP_REQUIRED, SCHOOL_CONTEXT_REQUIRED, FORBIDDEN, LABORATORY_NOT_FOUND]
    ValidationError:
      type: object
      required: [message, code, errors]
      properties:
        message:
          type: string
        code:
          type: string
          const: VALIDATION_FAILED
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
