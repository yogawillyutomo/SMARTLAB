openapi: 3.1.0
info:
  title: SmartLab API
  version: 0.10.0
  description: Contract for implemented SmartLab API v1 session authentication, identity, Laboratory, Device, Layout, and Incident endpoints.
servers:
  - url: http://localhost:8000/api/v1
    description: Local Laravel API
paths:
  /health:
    get:
      operationId: getHealth
      summary: Read the public SmartLab API health status
      responses:
        '200':
          description: Safe API health response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /me:
    get:
      operationId: getCurrentUser
      summary: Read the authenticated user's current school membership context
      security:
        - sanctumSession: []
        - sanctumBearer: []
      responses:
        '200':
          description: Current user and exactly one active school membership context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: No active membership exists, or school context selection is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/login:
    post:
      operationId: loginSpaSession
      summary: Authenticate the first-party SPA with a Laravel session
      description: After obtaining `/sanctum/csrf-cookie`, submit credentials from a configured Sanctum stateful origin. Successful authentication rotates the session identifier, clears the email-plus-IP throttle, and never issues a personal access token. Unknown email, wrong password, and inactive accounts share one response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaSessionLoginRequest'
      responses:
        '204':
          description: Session authenticated; response has no body
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyLoginAttempts'
  /auth/logout:
    post:
      operationId: logoutSpaSession
      summary: End only the current first-party SPA session
      description: Invalidates the current session, regenerates its CSRF token, and returns no body. It does not revoke personal access tokens, remember tokens for other devices, or other sessions.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      responses:
        '204':
          description: Current session ended; response has no body
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /laboratories:
    get:
      operationId: listLaboratories
      summary: List Laboratories owned by the current school
      description: Requires the `laboratories.view` permission. Results are sorted by code and tenant-scoped to the active membership.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      responses:
        '200':
          description: Current-school Laboratory collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaboratoryCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MembershipContextConflict'
    post:
      operationId: createLaboratory
      summary: Create a Laboratory for the current school
      description: Requires the `laboratories.create` permission. The server derives `schoolId` from the active membership and enforces code uniqueness inside that school.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLaboratoryRequest'
      responses:
        '201':
          description: Laboratory created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaboratoryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MembershipContextConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /laboratories/{laboratoryId}:
    parameters:
      - name: laboratoryId
        in: path
        required: true
        description: Laboratory ULID. Lookups are always scoped to the current school.
        schema:
          type: string
          format: ulid
    get:
      operationId: getLaboratory
      summary: Read one Laboratory owned by the current school
      description: Requires the `laboratories.view` permission. Another school's Laboratory is indistinguishable from a missing Laboratory.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      responses:
        '200':
          description: Current-school Laboratory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaboratoryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/LaboratoryNotFound'
        '409':
          $ref: '#/components/responses/MembershipContextConflict'
    patch:
      operationId: updateLaboratory
      summary: Partially update one Laboratory owned by the current school
      description: Requires the `laboratories.update` permission. At least one mutable field must be supplied; identifiers, tenant ownership, and timestamps are immutable.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLaboratoryRequest'
      responses:
        '200':
          description: Updated Laboratory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaboratoryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/LaboratoryNotFound'
        '409':
          description: School context conflict, or the Laboratory cannot become inactive while a prepared/in-progress Laboratory Session uses it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /devices:
    get:
      operationId: listDevices
      summary: List Devices owned by the current school
      description: Requires the exact `devices.view` permission. Results are tenant-scoped, paginated, and deterministically ordered by normalized device code then Device ULID. Technical-profile JSON is never searched.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: homeLaboratoryId
          in: query
          description: Same-school canonical Laboratory ULID. Inactive same-school Laboratories remain valid filters; unknown and cross-tenant IDs share one validation response.
          schema:
            type: string
            format: ulid
        - name: deviceType
          in: query
          schema:
            $ref: '#/components/schemas/DeviceType'
        - name: lifecycleStatus
          in: query
          schema:
            $ref: '#/components/schemas/DeviceLifecycleStatus'
        - name: search
          in: query
          description: Case-insensitive literal substring search over deviceCode, hostname, serialNumber, brand, and model only. Percent, underscore, and backslash are treated as literal characters rather than SQL wildcard syntax.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Current-school Device page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MembershipContextConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      operationId: createDevice
      summary: Create a Device for the current school
      description: Requires the exact `devices.create` permission. The server derives school ownership, generates the ULID and opaque QR public ID, initializes both versions to 1, and writes internal Device history atomically.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequest'
      responses:
        '201':
          description: Device created
          headers:
            ETag:
              $ref: '#/components/headers/DeviceETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MembershipContextConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        description: Internal Device ULID. Lookups are always scoped to the current school; this identifier is never a QR payload.
        schema:
          type: string
          format: ulid
    get:
      operationId: getDevice
      summary: Read one Device owned by the current school
      description: Requires the exact `devices.view` permission. Another school's Device is indistinguishable from a missing Device.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      responses:
        '200':
          description: Current-school Device
          headers:
            ETag:
              $ref: '#/components/headers/DeviceETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '409':
          $ref: '#/components/responses/MembershipContextConflict'
    patch:
      operationId: updateDevice
      summary: Update mutable Device v1 fields with optimistic concurrency
      description: Requires the exact `devices.update` permission and a strong If-Match value equal to the current Device version, including for an effective no-op. Technical profile is atomically replaced, home Laboratory permits initial assignment only, and generic lifecycle updates permit only in_service and spare. An effective mutation increments version once and emits a new ETag; an effective no-op returns 200 with the existing version, ETag, updatedAt, and no history event.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - name: If-Match
          in: header
          required: true
          description: Strong quoted positive integer equal to the Device DTO version, for example `"1"`. Weak, wildcard, unquoted, multiple, and malformed validators are rejected.
          schema:
            type: string
            pattern: '^"[1-9][0-9]*"$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceRequest'
      responses:
        '200':
          description: Canonical Device after PATCH. An effective mutation increments version exactly once; an effective no-op preserves version and ETag. Both require a matching If-Match precondition.
          headers:
            ETag:
              $ref: '#/components/headers/DeviceETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '409':
          $ref: '#/components/responses/DevicePatchConflict'
        '412':
          $ref: '#/components/responses/DeviceVersionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /devices/{deviceId}/transfers:
    parameters:
      - name: deviceId
        in: path
        required: true
        description: Internal Device ULID scoped to the current School.
        schema: { type: string, format: ulid }
    get:
      operationId: listDeviceTransfers
      summary: List immutable Device transfer history
      description: Requires the exact `device-transfers.view` permission. Results are tenant-scoped, snapshot-based, and ordered by createdAt descending then Transfer ULID descending.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Device transfer history page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceTransferCollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/DeviceNotFound' }
        '409': { $ref: '#/components/responses/MembershipContextConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createDeviceTransfer
      summary: Transfer Device home custody to another Laboratory
      description: Requires the exact `device-transfers.create` permission and a strong If-Match equal to the current Device version. The server derives the source Laboratory, validates Layout and lifecycle invariants under deterministic locks, changes only Device homeLaboratoryId, increments version once, and writes one immutable transfer record plus one device.transferred history event atomically.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - name: If-Match
          in: header
          required: true
          description: Strong quoted positive integer equal to the Device DTO version.
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDeviceTransferRequest' }
      responses:
        '201':
          description: Transfer committed and Device custody changed
          headers:
            ETag: { $ref: '#/components/headers/DeviceETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceTransferResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Device or destination Laboratory not found
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409': { $ref: '#/components/responses/DeviceTransferConflict' }
        '412': { $ref: '#/components/responses/DeviceVersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /incidents/reporting-context/laboratories:
    get:
      operationId: listIncidentReportingLaboratories
      summary: Discover active Laboratories eligible for Incident reporting
      description: Requires only `incidents.create`; general Laboratory and Device view permissions are not required. Results are limited to active Laboratories in the current School, ordered by normalized code then ULID.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - name: search
          in: query
          description: Optional trimmed literal search over Laboratory code or name. Percent, underscore, and backslash are not wildcards.
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Current-School active Laboratory reporting candidates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentReportingLaboratoryCollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/MembershipContextConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /incidents/reporting-context/laboratories/{laboratoryId}/devices:
    parameters:
      - name: laboratoryId
        in: path
        required: true
        description: Candidate Laboratory identifier. Malformed, unknown, cross-School, and inactive identifiers share the canonical safe not-found response.
        schema: { type: string }
    get:
      operationId: listIncidentReportingDevices
      summary: Search bounded Device candidates eligible for Incident reporting
      description: "Requires only `incidents.create`; general Laboratory and Device view permissions are not required. Search is mandatory and this endpoint is intentionally non-browsable: it returns at most 20 candidates and only signals whether the search should be refined."
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - name: search
          in: query
          required: true
          description: Trimmed literal search over Device code only. Percent, underscore, and backslash are not wildcards.
          schema: { type: string, minLength: 2, maxLength: 100 }
      responses:
        '200':
          description: Up to 20 eligible Device reporting candidates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentReportingDeviceCollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/IncidentReportingLaboratoryNotFound' }
        '409': { $ref: '#/components/responses/MembershipContextConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /incidents/assignee-candidates:
    get:
      operationId: listIncidentAssigneeCandidates
      summary: List eligible Incident assignee memberships
      description: Requires only `incidents.assign`. Returns active memberships in the current School whose active User has effective `incidents.update`; role names are never assignment authority. Results expose only membership ID plus User ID/name and are ordered by normalized User name then membership ULID.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - name: search
          in: query
          description: Optional trimmed case-insensitive literal substring search over User name only. Percent, underscore, and backslash are not wildcards.
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Current-School eligible assignee membership page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentAssigneeCandidateCollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/MembershipContextConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /incidents/submissions/{submissionId}:
    parameters:
      - name: submissionId
        in: path
        required: true
        description: Opaque create correlation. Malformed, unknown, cross-School, other-reporter, noncommitted, and otherwise non-visible values share the exact canonical safe not-found response.
        schema: { type: string }
    get:
      operationId: recoverIncidentSubmission
      summary: Recover the current Incident after an ambiguous create response
      description: Requires `incidents.view`. Lookup is restricted to the current School and authenticated reporter User snapshot; `incidents.view-all` never widens this endpoint. Replacement membership for the same User remains eligible.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      responses:
        '200':
          description: Current canonical Incident for the committed same-reporter submission
          headers:
            ETag: { $ref: '#/components/headers/IncidentETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/IncidentSubmissionNotFound' }
        '409': { $ref: '#/components/responses/MembershipContextConflict' }
  /incidents:
    get:
      operationId: listIncidents
      summary: List visible Incidents using immutable root snapshots
      description: Requires `incidents.view`. Without `incidents.view-all`, visibility is restricted to rows whose reporter User snapshot equals the authenticated User. Visibility and School scope are applied before filters, counts, and pagination.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/IncidentStatus' } }
        - { name: priority, in: query, schema: { $ref: '#/components/schemas/IncidentPriority' } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/IncidentCategory' } }
        - { name: laboratoryId, in: query, schema: { type: string, format: ulid } }
        - { name: deviceId, in: query, schema: { type: string, format: ulid } }
        - { name: assigneeMembershipId, in: query, schema: { type: string, format: ulid } }
        - { name: reportedFrom, in: query, description: Inclusive RFC3339 lower bound., schema: { type: string, format: date-time } }
        - { name: reportedTo, in: query, description: Inclusive RFC3339 upper bound and must not precede reportedFrom., schema: { type: string, format: date-time } }
        - name: search
          in: query
          description: Trimmed literal search over ticket number, title, Laboratory code snapshot, and Device code snapshot.
          schema: { type: string, minLength: 2, maxLength: 100 }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Reporter-own or view-all Incident summary page inside the current School
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentListResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/MembershipContextConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createIncident
      summary: Create an Incident with reporter-scoped submission correlation
      description: Requires `incidents.create` only. School and reporter authority come from the active membership context. Business fields are accepted from the JSON body only; any query parameter is rejected with 422. A new submission returns 201; an equivalent committed repeat under its stored fingerprint version returns the current canonical Incident with 200 and allocates no additional ticket or event.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIncidentRequest' }
      responses:
        '200':
          description: Equivalent committed submission; current canonical Incident returned without mutation
          headers:
            ETag: { $ref: '#/components/headers/IncidentETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentResponse' }
        '201':
          description: New Incident, submission mapping, ticket allocation, and reported event committed atomically
          headers:
            ETag: { $ref: '#/components/headers/IncidentETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IncidentCreateConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /incidents/{incidentId}:
    parameters:
      - name: incidentId
        in: path
        required: true
        description: Incident ULID. Lookup starts inside the current School and then applies the reporter-own or incidents.view-all row policy.
        schema:
          type: string
          format: ulid
    get:
      operationId: getIncident
      summary: Read one visible Incident using immutable display snapshots
      description: Requires the exact `incidents.view` permission. Without `incidents.view-all`, only Incidents whose reporter User snapshot equals the authenticated User are visible. Unknown, cross-School, and same-School row-invisible identifiers return the same safe not-found response.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      responses:
        '200':
          description: Canonical snapshot-authoritative Incident detail
          headers:
            ETag:
              $ref: '#/components/headers/IncidentETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/IncidentNotFound'
        '409':
          $ref: '#/components/responses/MembershipContextConflict'
    patch:
      operationId: updateReportedIncident
      summary: Correct reporting facts while an Incident remains reported
      description: Requires `incidents.view`, `incidents.update`, and `incidents.assign`. The body must be a nonempty subset of the exact ten correction fields and query parameters are rejected. Canonically equivalent requests are successful no-ops that preserve version, updatedAt, snapshots, and event history. Meaningful corrections increment the version once and append one `incident.updated` event. Only reported Incidents may be corrected.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/IncidentIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateIncidentRequest' }
      responses:
        '200':
          description: Current full Incident detail after a meaningful correction or canonical no-op
          headers:
            ETag: { $ref: '#/components/headers/IncidentETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/IncidentNotFound' }
        '409': { $ref: '#/components/responses/IncidentCorrectionConflict' }
        '412': { $ref: '#/components/responses/IncidentVersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/IncidentPreconditionRequired' }
  /incidents/{incidentId}/assignments:
    parameters:
      - name: incidentId
        in: path
        required: true
        description: Incident ULID resolved through the normal current-School reporter-own or incidents.view-all row policy.
        schema: { type: string, format: ulid }
    post:
      operationId: assignIncident
      summary: Initially assign or reassign an Incident
      description: Requires `incidents.view`, `incidents.assign`, and a current strong Incident If-Match. Initial assignment is allowed only from triaged and atomically enters assigned. Reassignment is allowed while assigned or in_progress, and as recovery from resolved only when canonical current-assignee snapshots already exist; resolved without those snapshots cannot be initially assigned. Resolved recovery preserves status, resolution evidence, original assignment time, and any first-start timestamp. If the old live membership reference was nulled by deletion, the previous membership ID is reconstructed from immutable assignment history. Reassignment requires a 5-1000 character reason. Assigning the same current live membership in an otherwise legal state is a version-protected effective no-op even when a reason is supplied.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/IncidentIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignIncidentRequest' }
      responses:
        '200':
          description: Current Incident after initial assignment, reassignment/recovery, or same-assignee no-op
          headers:
            ETag: { $ref: '#/components/headers/IncidentETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/IncidentAssignmentNotFound' }
        '409': { $ref: '#/components/responses/IncidentAssignmentConflict' }
        '412': { $ref: '#/components/responses/IncidentVersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/IncidentPreconditionRequired' }
  /incidents/{incidentId}/transitions:
    parameters:
      - name: incidentId
        in: path
        required: true
        description: Incident ULID resolved through the normal current-School reporter-own or incidents.view-all row policy.
        schema: { type: string, format: ulid }
    post:
      operationId: transitionIncident
      summary: Transition an Incident through the canonical lifecycle graph
      description: Requires `incidents.view` plus a current strong Incident If-Match. The server locks the visible Incident, rejects stale versions before edge or eligibility oracles, resolves the exact lifecycle edge, and then requires that edge's permission (`incidents.approve` or `incidents.update`). Progress edges requiring `incidents.update` additionally require the actor to be the current live assignee or to hold `incidents.assign` as an administrative override. Every transition into `in_progress` requires the canonical current-assignee snapshots plus a live same-School active membership/User that still has effective `incidents.update`. Resolved reopen is snapshot-path-aware: snapshot-present Incidents reopen only to `in_progress`; snapshot-absent Incidents reopen only to `triaged`. Broken snapshot-backed assignments return `INCIDENT_ASSIGNEE_INELIGIBLE` and must be recovered through the assignment endpoint before retrying with a fresh version.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/IncidentIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionIncidentRequest' }
      responses:
        '200':
          description: Current Incident after one canonical lifecycle transition; version increments exactly once and one typed Incident event is appended atomically.
          headers:
            ETag: { $ref: '#/components/headers/IncidentETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/IncidentNotFound' }
        '409': { $ref: '#/components/responses/IncidentTransitionConflict' }
        '412': { $ref: '#/components/responses/IncidentVersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/IncidentPreconditionRequired' }
  /incidents/{incidentId}/comments:
    parameters:
      - name: incidentId
        in: path
        required: true
        description: Incident ULID resolved through the normal current-School reporter-own or incidents.view-all row policy.
        schema: { type: string, format: ulid }
    get:
      operationId: listIncidentComments
      summary: List participant-visible append-only Incident comments
      description: Requires only `incidents.view` plus normal Incident row visibility; `incidents.comment` and `incidents.view-history` are not required. Only immutable `incident.comment_added` events are projected. Actor identity comes from event snapshots, and results are ordered by createdAt descending then comment/event ULID descending.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Participant-safe Incident comment page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentCommentCollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/IncidentNotFound' }
        '409': { $ref: '#/components/responses/MembershipContextConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: addIncidentComment
      summary: Append a participant-visible Incident comment
      description: Requires `incidents.view`, `incidents.comment`, and a current strong Incident If-Match. Query parameters and unknown body fields are rejected. Text is normalized by trimming and NFC before validation and persistence. Comments are append-only: every successful request in a non-terminal Incident increments the Incident version exactly once and appends exactly one immutable `incident.comment_added` event. Identical text submitted with a fresh version is a new comment; a stale retry returns 412. New comments are unavailable only in terminal `closed` and `rejected` states.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/IncidentIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIncidentCommentRequest' }
      responses:
        '201':
          description: Comment appended, Incident version incremented once, and one comment event committed atomically
          headers:
            ETag: { $ref: '#/components/headers/IncidentETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentCommentResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/IncidentNotFound' }
        '409': { $ref: '#/components/responses/IncidentCommentConflict' }
        '412': { $ref: '#/components/responses/IncidentVersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/IncidentPreconditionRequired' }
  /incidents/{incidentId}/events:
    parameters:
      - name: incidentId
        in: path
        required: true
        description: Incident ULID resolved through the normal current-School reporter-own or incidents.view-all row policy.
        schema: { type: string, format: ulid }
    get:
      operationId: listIncidentEvents
      summary: List complete immutable internal Incident event history
      description: Requires `incidents.view` and `incidents.view-history`. The history permission never widens normal Incident row visibility. Results contain every typed immutable Incident event, including participant comments, using Incident/ticket and actor User/membership snapshots as historical authority rather than nullable live foreign keys. Results are ordered by createdAt descending then event ULID descending.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Complete internal Incident event history page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentEventCollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/IncidentNotFound' }
        '409': { $ref: '#/components/responses/MembershipContextConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /laboratories/{laboratoryId}/layouts:
    parameters:
      - name: laboratoryId
        in: path
        required: true
        description: Laboratory ULID resolved inside the current School.
        schema: { type: string, format: ulid }
    get:
      operationId: listLaboratoryLayouts
      summary: List Layout summaries for one Laboratory
      description: Requires `layouts.view`. Results are tenant-scoped and ordered by createdAt descending, then Layout ULID ascending.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/LayoutStatus' }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Current-School Layout summary page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutSummaryCollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/LaboratoryNotFound' }
        '409': { $ref: '#/components/responses/MembershipContextConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createLaboratoryLayoutDraft
      summary: Create the Laboratory's sole draft Layout
      description: Requires `layouts.create`. When an active Layout exists, the server clones its complete aggregate with new root and child ULIDs and accepts only an optional name override. Otherwise name, rows, and columns are required and an empty sparse draft is created.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLayoutRequest' }
      responses:
        '201':
          description: Draft Layout created
          headers:
            ETag: { $ref: '#/components/headers/LayoutETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/LaboratoryNotFound' }
        '409': { $ref: '#/components/responses/LayoutConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /layouts/{layoutId}:
    parameters:
      - name: layoutId
        in: path
        required: true
        description: Layout ULID resolved inside the current School.
        schema: { type: string, format: ulid }
    get:
      operationId: getLayout
      summary: Read a canonical full Layout aggregate
      description: Requires `layouts.view`. Draft, active, and archived Layouts are readable. Child collections are deterministically ordered by row, column, then child ULID.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      responses:
        '200':
          description: Canonical Layout aggregate
          headers:
            ETag: { $ref: '#/components/headers/LayoutETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/LayoutNotFound' }
        '409': { $ref: '#/components/responses/MembershipContextConflict' }
    put:
      operationId: replaceLayoutDraft
      summary: Atomically replace the complete mutable draft aggregate
      description: Requires `layouts.update` and exactly one strong quoted positive-integer If-Match value. Active and archived Layouts are immutable. Canonically equivalent normalized input is an effective no-op that preserves version, ETag, updatedAt, and history. A syntactically valid but stale version returns 412; missing or malformed input returns 428.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/LayoutIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceLayoutRequest' }
      responses:
        '200':
          description: Canonical saved or unchanged draft Layout
          headers:
            ETag: { $ref: '#/components/headers/LayoutETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/LayoutNotFound' }
        '409': { $ref: '#/components/responses/LayoutConflict' }
        '412': { $ref: '#/components/responses/LayoutVersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/LayoutPreconditionRequired' }
    delete:
      operationId: deleteLayoutDraft
      summary: Delete a draft Layout and its children
      description: Requires `layouts.delete` and exact If-Match. Draft cleanup remains allowed when the Laboratory is inactive; active and archived Layouts cannot be deleted. Internal audit history survives with snapshot identifiers.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/LayoutIfMatch'
      responses:
        '204': { description: Draft Layout deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/LayoutNotFound' }
        '409': { $ref: '#/components/responses/LayoutConflict' }
        '412': { $ref: '#/components/responses/LayoutVersionConflict' }
        '428': { $ref: '#/components/responses/LayoutPreconditionRequired' }
  /layouts/{layoutId}/activate:
    parameters:
      - name: layoutId
        in: path
        required: true
        schema: { type: string, format: ulid }
    post:
      operationId: activateLayoutDraft
      summary: Activate a draft and atomically archive its predecessor
      description: Requires `layouts.update` and exact If-Match. The request body must be empty. The complete aggregate and current Device eligibility are revalidated under locks; the new active Layout and predecessor each increment version exactly once with one effective timestamp.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/LayoutIfMatch'
      responses:
        '200':
          description: Newly active Layout
          headers:
            ETag: { $ref: '#/components/headers/LayoutETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/LayoutNotFound' }
        '409': { $ref: '#/components/responses/LayoutConflict' }
        '412': { $ref: '#/components/responses/LayoutVersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/LayoutPreconditionRequired' }
  /layouts/{layoutId}/unplaced-devices:
    parameters:
      - name: layoutId
        in: path
        required: true
        schema: { type: string, format: ulid }
    get:
      operationId: listUnplacedLayoutDevices
      summary: List eligible Devices unplaced relative to this Layout
      description: Requires both `layouts.view` and `devices.view`. Only draft or active Layouts are accepted. The server selects current-School, matching-home, in-service or spare Devices absent from this specific Layout.
      security:
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: search
          in: query
          description: Literal case-insensitive substring search over deviceCode, hostname, serialNumber, brand, and model only.
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Unplaced Device candidate page ordered by deviceCode then Device ULID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnplacedDeviceCollectionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/LayoutNotFound' }
        '409': { $ref: '#/components/responses/LayoutConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
components:
  securitySchemes:
    sanctumSession:
      type: apiKey
      in: cookie
      name: smartlab-api-session
      description: Browser-managed Laravel session cookie for the first-party stateful SPA. This is the local default derived from APP_NAME; deployments may configure SESSION_COOKIE, so the cookie name is not a stable production contract.
    sanctumBearer:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Sanctum personal access token for mobile or API token clients.
  parameters:
    IncidentIfMatch:
      name: If-Match
      in: header
      required: true
      description: Exactly one strong quoted positive integer equal to the Incident version, for example `"1"`. Missing, weak, wildcard, unquoted, multiple, whitespace-padded, zero, negative, overflow, and malformed values return 428. A valid but stale value returns 412.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    LayoutIfMatch:
      name: If-Match
      in: header
      required: true
      description: Exactly one strong quoted positive integer equal to the Layout version, for example `"1"`. Missing, weak, wildcard, unquoted, multiple, whitespace-padded, zero, negative, and malformed values return 428. A valid but stale value returns 412.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
  responses:
    Unauthenticated:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Authentication is required.
            code: UNAUTHENTICATED
    Forbidden:
      description: The active membership lacks the endpoint permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    LaboratoryNotFound:
      description: No Laboratory exists in the current school with this identifier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    DeviceNotFound:
      description: No Device exists in the current school with this identifier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Device not found.
            code: DEVICE_NOT_FOUND
    LayoutNotFound:
      description: No Layout exists in the current School with this identifier
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            message: Layout not found.
            code: LAYOUT_NOT_FOUND
    IncidentNotFound:
      description: No Incident is visible under the current School and reporter-own or incidents.view-all row policy
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            message: Incident not found.
            code: INCIDENT_NOT_FOUND
    IncidentSubmissionNotFound:
      description: The recovery correlation is malformed, unknown, cross-School, owned by another reporter, noncommitted, or otherwise non-visible; all cases use this exact response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            message: Incident submission not found.
            code: INCIDENT_SUBMISSION_NOT_FOUND
    IncidentCreateConflict:
      description: Membership context is unresolved, the submission conflicts, a subject is ineligible, or the ticket sequence is exhausted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            submissionConflict: { value: { message: The submission ID was already used for different Incident data., code: INCIDENT_SUBMISSION_CONFLICT } }
            laboratoryIneligible: { value: { message: The Laboratory is not eligible for Incident reporting., code: INCIDENT_LABORATORY_INELIGIBLE } }
            deviceIneligible: { value: { message: The Device is not eligible for this Incident., code: INCIDENT_DEVICE_NOT_ELIGIBLE } }
            ticketExhausted: { value: { message: The Incident ticket sequence is exhausted for this School and year., code: INCIDENT_TICKET_SEQUENCE_EXHAUSTED } }
    IncidentCorrectionConflict:
      description: Membership context is unresolved, the Incident is no longer reported, or the effective corrected Laboratory or Device is ineligible
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            status: { value: { message: The operation is unavailable in the current Incident status., code: INCIDENT_STATUS_CONFLICT } }
            laboratoryIneligible: { value: { message: The Laboratory is not eligible for Incident reporting., code: INCIDENT_LABORATORY_INELIGIBLE } }
            deviceIneligible: { value: { message: The Device is not eligible for this Incident., code: INCIDENT_DEVICE_NOT_ELIGIBLE } }
    IncidentAssignmentNotFound:
      description: The Incident is not visible, or the requested assignee membership is unknown or outside the current School
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            incident: { value: { message: Incident not found., code: INCIDENT_NOT_FOUND } }
            assignee: { value: { message: The Incident assignee was not found., code: INCIDENT_ASSIGNEE_NOT_FOUND } }
    IncidentAssignmentConflict:
      description: Membership context is unresolved, the current Incident status does not accept assignment, or the requested same-School membership/User is not currently eligible
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            status: { value: { message: The operation is unavailable in the current Incident status., code: INCIDENT_STATUS_CONFLICT } }
            assigneeIneligible: { value: { message: The Incident assignee is not eligible., code: INCIDENT_ASSIGNEE_INELIGIBLE } }
    IncidentTransitionConflict:
      description: The requested lifecycle edge is invalid, or a snapshot-present transition into in_progress cannot use the current live assignee because it is missing or no longer progress-eligible.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            invalidTransition: { value: { message: The requested Incident transition is not allowed., code: INCIDENT_INVALID_TRANSITION } }
            assigneeIneligible: { value: { message: The Incident assignee is not eligible., code: INCIDENT_ASSIGNEE_INELIGIBLE } }
    IncidentCommentConflict:
      description: Membership context is unresolved, or the Incident is terminal and no longer accepts new participant comments.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            message: The operation is unavailable in the current Incident status.
            code: INCIDENT_STATUS_CONFLICT
    IncidentPreconditionRequired:
      description: An Incident mutation is missing the exact strong quoted positive-integer If-Match precondition or supplies a malformed form
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            message: A valid If-Match Incident version is required.
            code: PRECONDITION_REQUIRED
    IncidentVersionConflict:
      description: The supplied syntactically valid Incident version is stale, including stale routing evidence
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            message: The Incident has changed since it was loaded.
            code: INCIDENT_VERSION_CONFLICT
    IncidentReportingLaboratoryNotFound:
      description: The reporting-context Laboratory identifier is malformed, unknown, cross-School, or inactive
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            message: Laboratory not found.
            code: LABORATORY_NOT_FOUND
    LayoutConflict:
      description: The Layout operation violates lifecycle, Laboratory, Device-placement, or geometry invariants
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            draftExists: { value: { message: A draft Layout already exists for this Laboratory., code: LAYOUT_DRAFT_ALREADY_EXISTS } }
            status: { value: { message: The requested operation is valid only for a draft Layout., code: LAYOUT_STATUS_CONFLICT } }
            inactive: { value: { message: The Laboratory must be active for this Layout operation., code: LAYOUT_LABORATORY_INACTIVE } }
            duplicateDevice: { value: { message: A Device may be placed only once in a Layout., code: LAYOUT_DEVICE_ALREADY_PLACED } }
            homeMismatch: { value: { message: The Device home Laboratory does not match this Layout., code: LAYOUT_DEVICE_HOME_MISMATCH } }
            ineligibleDevice: { value: { message: The Device lifecycle is not eligible for Layout placement., code: LAYOUT_DEVICE_NOT_ELIGIBLE } }
            occupied: { value: { message: Two Layout footprints occupy the same position., code: LAYOUT_POSITION_OCCUPIED } }
    LayoutPreconditionRequired:
      description: A Layout mutation is missing the exact strong quoted positive-integer If-Match precondition or supplies a malformed form
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            message: A valid If-Match Layout version is required.
            code: PRECONDITION_REQUIRED
    LayoutVersionConflict:
      description: The supplied syntactically valid Layout version is stale
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            message: Layout has changed since it was loaded.
            code: LAYOUT_VERSION_CONFLICT
    PreconditionRequired:
      description: PATCH is missing an exact strong Device version precondition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: A valid If-Match Device version is required.
            code: PRECONDITION_REQUIRED
    DeviceVersionConflict:
      description: The supplied valid Device version is stale
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Device has changed since it was loaded.
            code: DEVICE_VERSION_CONFLICT
    DevicePatchConflict:
      description: Membership context is unresolved, an established home Laboratory change requires Transfer, or a terminal Device lifecycle cannot be changed by generic PATCH
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            transferRequired:
              value:
                message: Established Device home Laboratory changes require the Device Transfer domain.
                code: DEVICE_HOME_LABORATORY_TRANSFER_REQUIRED
            lifecycleInvalid:
              value:
                message: The requested Device lifecycle transition is invalid.
                code: DEVICE_LIFECYCLE_TRANSITION_INVALID
    DeviceTransferConflict:
      description: The transfer violates custody, destination, Layout, or Device lifecycle invariants
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            unassigned: { value: { message: The Device has no source Laboratory., code: TRANSFER_SOURCE_UNASSIGNED } }
            sameLaboratory: { value: { message: The destination Laboratory is already the Device home Laboratory., code: TRANSFER_SAME_LABORATORY } }
            activePlacement: { value: { message: The Device has an active Layout placement., code: TRANSFER_ACTIVE_PLACEMENT_EXISTS } }
            draftReference: { value: { message: The Device is referenced by the current draft Layout., code: TRANSFER_DRAFT_REFERENCE_EXISTS } }
            destination: { value: { message: The destination Laboratory must be active., code: TRANSFER_DESTINATION_INELIGIBLE } }
            lifecycle: { value: { message: The Device lifecycle is not eligible for transfer., code: TRANSFER_DEVICE_NOT_ELIGIBLE } }
    MembershipContextConflict:
      description: No active membership exists, or school context selection is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ValidationFailed:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    InvalidCredentials:
      description: Credentials are invalid or the account is inactive
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: The provided credentials are invalid.
            code: INVALID_CREDENTIALS
    TooManyLoginAttempts:
      description: The email-plus-IP login limit has been exceeded; a Retry-After header is returned
      headers:
        Retry-After:
          description: Seconds until another login attempt may be made
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Too many login attempts. Please try again later.
            code: TOO_MANY_LOGIN_ATTEMPTS
  headers:
    DeviceETag:
      description: Strong entity tag whose quoted positive integer exactly matches `data.version`.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
      example: '"1"'
    LayoutETag:
      description: Strong entity tag whose quoted positive integer exactly matches `data.version`.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
      example: '"1"'
    IncidentETag:
      description: Strong entity tag whose quoted positive integer exactly matches the persisted Incident aggregate `data.version`.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
      example: '"1"'
