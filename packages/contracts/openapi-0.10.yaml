        impact: { type: [string, 'null'], minLength: 1, maxLength: 2000, readOnly: true }
        blocksLaboratoryOperation: { type: boolean, readOnly: true }
        stepsTaken: { type: [string, 'null'], minLength: 1, maxLength: 2000, readOnly: true }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        assignee:
          oneOf:
            - $ref: '#/components/schemas/IncidentAssigneeSnapshot'
