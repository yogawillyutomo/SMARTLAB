        - verifiedAt
        - closedAt
        - rejectedAt
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: ulid, readOnly: true }
        ticketNumber: { type: string, pattern: '^INC-[0-9]{4}-[0-9]{6}$', readOnly: true }
        reporter: { $ref: '#/components/schemas/IncidentReporterSnapshot' }
