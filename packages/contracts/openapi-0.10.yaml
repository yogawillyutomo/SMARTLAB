        triageSummary: { type: [string, 'null'], minLength: 1, maxLength: 2000, readOnly: true }
        resolutionSummary: { type: [string, 'null'], minLength: 5, maxLength: 4000, readOnly: true }
        rejectionReason: { type: [string, 'null'], minLength: 5, maxLength: 1000, readOnly: true }
        verificationNote: { type: [string, 'null'], minLength: 1, maxLength: 2000, readOnly: true }
        version: { type: integer, minimum: 1, readOnly: true }
        occurredAt: { type: string, format: date-time, readOnly: true }
        reportedAt: { type: string, format: date-time, readOnly: true }
        triagedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        assignedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        startedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        resolvedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        verifiedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        closedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        rejectedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
    IncidentReporterSnapshot:
      type: object
      additionalProperties: false
      required: [userId, name]
      properties:
        userId: { type: string, format: ulid, readOnly: true }
        name: { type: string, maxLength: 255, readOnly: true }
    IncidentLaboratorySnapshot:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id: { type: string, format: ulid, readOnly: true }
        code: { type: string, maxLength: 50, readOnly: true }
        name: { type: string, maxLength: 255, readOnly: true }
    IncidentDeviceSnapshot:
      type: object
      additionalProperties: false
      required: [id, deviceCode, deviceType]
      properties:
        id: { type: string, format: ulid, readOnly: true }
        deviceCode: { type: string, maxLength: 32, readOnly: true }
        deviceType: { type: string, maxLength: 32, readOnly: true }
    IncidentAssigneeSnapshot:
      type: object
      additionalProperties: false
      required: [membershipId, userId, name]
      properties:
        membershipId: { type: string, format: ulid, readOnly: true }
        userId: { type: string, format: ulid, readOnly: true }
        name: { type: string, maxLength: 255, readOnly: true }
    IncidentCategory:
      type: string
      enum: [hardware, software, network, electrical, peripheral, facility, cleanliness, security, other]
      readOnly: true
    IncidentPriority:
      type: string
      enum: [low, normal, high, critical]
      readOnly: true
    IncidentStatus:
      type: string
      enum: [reported, triaged, assigned, in_progress, resolved, verified, closed, rejected]
      readOnly: true
    DeviceTransfer:
      type: object
      additionalProperties: false
      required: [id, deviceId, deviceCode, sourceLaboratory, destinationLaboratory, reason, actor, deviceVersionBefore, deviceVersionAfter, createdAt]
      properties:
        id: { type: string, format: ulid, readOnly: true }
        deviceId: { type: string, format: ulid, readOnly: true }
        deviceCode: { type: string, maxLength: 32, readOnly: true }
        sourceLaboratory: { $ref: '#/components/schemas/DeviceTransferLaboratorySnapshot' }
        destinationLaboratory: { $ref: '#/components/schemas/DeviceTransferLaboratorySnapshot' }
        reason: { type: [string, 'null'], maxLength: 500 }
        actor: { $ref: '#/components/schemas/DeviceTransferActorSnapshot' }
        deviceVersionBefore: { type: integer, minimum: 1, readOnly: true }
        deviceVersionAfter: { type: integer, minimum: 1, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
    DeviceTransferLaboratorySnapshot:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id: { type: string, format: ulid, readOnly: true }
        code: { type: string, maxLength: 50, readOnly: true }
        name: { type: string, maxLength: 255, readOnly: true }
    DeviceTransferActorSnapshot:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: ulid, readOnly: true }
        name: { type: string, maxLength: 255, readOnly: true }
    CreateDeviceTransferRequest:
      type: object
      additionalProperties: false
      required: [destinationLaboratoryId]
      properties:
        destinationLaboratoryId:
          type: string
          format: ulid
          description: Active same-school destination Laboratory. Source is always derived from the current Device.
        reason:
          type: [string, 'null']
          maxLength: 500
          description: Optional trimmed operational reason; blank is stored as null.
    Device:
      type: object
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/DeviceTypeProfileConstraint'
      required: [id, schoolId, deviceCode, qrPublicId, deviceType, lifecycleStatus, homeLaboratoryId, serialNumber, hostname, brand, model, technicalProfileVersion, technicalProfile, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: ulid
          readOnly: true
        schoolId:
          type: string
          format: ulid
          readOnly: true
          description: Owning School derived from the active membership; never client-selectable.
        deviceCode:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9-]{2,31}$'
          minLength: 3
          maxLength: 32
          description: Canonical uppercase, location-neutral, and unique inside the School.
        qrPublicId:
          type: string
          pattern: '^devq_[A-Za-z0-9_-]{22}$'
          readOnly: true
          description: Server-generated opaque identifier containing 128 random bits; never authorization.
        deviceType:
          $ref: '#/components/schemas/DeviceType'
        lifecycleStatus:
          $ref: '#/components/schemas/DeviceLifecycleStatus'
        homeLaboratoryId:
          type: [string, 'null']
          format: ulid
          description: Nullable canonical home/custodial Laboratory, not current physical location.
        serialNumber:
          type: [string, 'null']
          maxLength: 255
        hostname:
          type: [string, 'null']
          maxLength: 255
        brand:
          type: [string, 'null']
          maxLength: 255
        model:
          type: [string, 'null']
          maxLength: 255
        technicalProfileVersion:
          type: integer
          minimum: 1
          readOnly: true
        technicalProfile:
          $ref: '#/components/schemas/DeviceTechnicalProfile'
        version:
          type: integer
          minimum: 1
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    CreateDeviceRequest:
      type: object
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/DeviceTypeProfileConstraint'
      required: [deviceCode, deviceType]
      properties:
        deviceCode:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9-]{2,31}$'
          minLength: 3
          maxLength: 32
          description: Trimmed and uppercased by the server before validation.
        deviceType:
          $ref: '#/components/schemas/DeviceType'
        homeLaboratoryId:
          type: [string, 'null']
          format: ulid
          description: When supplied, must reference an active Laboratory in the current School.
        lifecycleStatus:
          type: string
          enum: [in_service, spare]
          default: in_service
        serialNumber:
          type: [string, 'null']
          maxLength: 255
        hostname:
          type: [string, 'null']
          maxLength: 255
        brand:
          type: [string, 'null']
          maxLength: 255
        model:
          type: [string, 'null']
          maxLength: 255
        technicalProfile:
          allOf:
            - $ref: '#/components/schemas/DeviceTechnicalProfile'
          default: {}
          description: Complete type-specific JSON object selected by root deviceType; kind and schemaVersion are prohibited.
    UpdateDeviceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        serialNumber:
          type: [string, 'null']
          maxLength: 255
        hostname:
          type: [string, 'null']
          maxLength: 255
        brand:
          type: [string, 'null']
          maxLength: 255
        model:
          type: [string, 'null']
          maxLength: 255
        homeLaboratoryId:
          type: [string, 'null']
          format: ulid
          description: Generic PATCH permits null-to-active-same-School initial assignment or same-value no-op only.
        technicalProfile:
          $ref: '#/components/schemas/DeviceTechnicalProfile'
          description: Complete atomic replacement validated against the immutable stored deviceType; never merged.
        lifecycleStatus:
          type: string
          enum: [in_service, spare]
    DeviceTechnicalProfile:
      description: Type-specific JSON object. Root deviceType is the only discriminator. The server enforces a serialized maximum of 16 KiB and exact type/profile correspondence.
      anyOf:
        - $ref: '#/components/schemas/DesktopPcTechnicalProfile'
        - $ref: '#/components/schemas/LaptopTechnicalProfile'
        - $ref: '#/components/schemas/ServerTechnicalProfile'
        - $ref: '#/components/schemas/NetworkSwitchTechnicalProfile'
        - $ref: '#/components/schemas/RouterTechnicalProfile'
        - $ref: '#/components/schemas/AccessPointTechnicalProfile'
        - $ref: '#/components/schemas/PrinterTechnicalProfile'
        - $ref: '#/components/schemas/ProjectorTechnicalProfile'
        - $ref: '#/components/schemas/UpsTechnicalProfile'
        - $ref: '#/components/schemas/OtherTechnicalProfile'
    DeviceTypeProfileConstraint:
      description: Correlates the immutable root deviceType discriminator with its exact technicalProfile schema. An omitted create profile defaults to the matching empty object.
      oneOf:
        - type: object
          required: [deviceType]
          properties:
            deviceType: { const: desktop_pc }
            technicalProfile: { $ref: '#/components/schemas/DesktopPcTechnicalProfile' }
        - type: object
          required: [deviceType]
          properties:
            deviceType: { const: laptop }
            technicalProfile: { $ref: '#/components/schemas/LaptopTechnicalProfile' }
        - type: object
          required: [deviceType]
          properties:
            deviceType: { const: server }
            technicalProfile: { $ref: '#/components/schemas/ServerTechnicalProfile' }
        - type: object
          required: [deviceType]
          properties:
            deviceType: { const: network_switch }
            technicalProfile: { $ref: '#/components/schemas/NetworkSwitchTechnicalProfile' }
        - type: object
          required: [deviceType]
          properties:
            deviceType: { const: router }
            technicalProfile: { $ref: '#/components/schemas/RouterTechnicalProfile' }
        - type: object
          required: [deviceType]
          properties:
            deviceType: { const: access_point }
            technicalProfile: { $ref: '#/components/schemas/AccessPointTechnicalProfile' }
        - type: object
          required: [deviceType]
          properties:
            deviceType: { const: printer }
            technicalProfile: { $ref: '#/components/schemas/PrinterTechnicalProfile' }
        - type: object
          required: [deviceType]
          properties:
            deviceType: { const: projector }
            technicalProfile: { $ref: '#/components/schemas/ProjectorTechnicalProfile' }
        - type: object
          required: [deviceType]
          properties:
            deviceType: { const: ups }
            technicalProfile: { $ref: '#/components/schemas/UpsTechnicalProfile' }
        - type: object
          required: [deviceType]
          properties:
            deviceType: { const: other }
            technicalProfile: { $ref: '#/components/schemas/OtherTechnicalProfile' }
    DesktopPcTechnicalProfile:
      type: object
      additionalProperties: false
      properties:
        processor: { type: string, maxLength: 255 }
        ramGB: { type: number, exclusiveMinimum: 0 }
        storageGB: { type: number, exclusiveMinimum: 0 }
        gpu: { type: string, maxLength: 255 }
        os: { type: string, maxLength: 255 }
    LaptopTechnicalProfile:
      type: object
      additionalProperties: false
      properties:
        processor: { type: string, maxLength: 255 }
        ramGB: { type: number, exclusiveMinimum: 0 }
        storageGB: { type: number, exclusiveMinimum: 0 }
        gpu: { type: string, maxLength: 255 }
        os: { type: string, maxLength: 255 }
        display: { type: string, maxLength: 255 }
    ServerTechnicalProfile:
      type: object
      additionalProperties: false
      properties:
        processor: { type: string, maxLength: 255 }
        cpuSockets: { type: integer, minimum: 1 }
        cpuCores: { type: integer, minimum: 1 }
        ramGB: { type: number, exclusiveMinimum: 0 }
        storageGB: { type: number, exclusiveMinimum: 0 }
        raidLevel: { type: string, maxLength: 255 }
        os: { type: string, maxLength: 255 }
    NetworkSwitchTechnicalProfile:
      type: object
      additionalProperties: false
      properties:
        portCount: { type: integer, minimum: 1 }
        managed: { type: boolean }
        poe: { type: boolean }
        poeBudgetWatts: { type: number, minimum: 0 }
        switchingCapacityGbps: { type: number, minimum: 0 }
        uplinkSpeedGbps: { type: number, minimum: 0 }
        firmwareVersion: { type: string, maxLength: 255 }
    RouterTechnicalProfile:
      type: object
      additionalProperties: false
      properties:
        wanPortCount: { type: integer, minimum: 0 }
        lanPortCount: { type: integer, minimum: 0 }
        throughputMbps: { type: number, minimum: 0 }
        wifiCapable: { type: boolean }
        firmwareVersion: { type: string, maxLength: 255 }
    AccessPointTechnicalProfile:
      type: object
      additionalProperties: false
      properties:
        wifiStandard: { type: string, maxLength: 255 }
        bands:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [2.4GHz, 5GHz, 6GHz]
        maxClients: { type: integer, minimum: 0 }
        poe: { type: boolean }
        firmwareVersion: { type: string, maxLength: 255 }
    PrinterTechnicalProfile:
      type: object
      additionalProperties: false
      properties:
        technology:
          type: string
          enum: [inkjet, laser, dot_matrix, thermal, other]
        color: { type: boolean }
        duplex: { type: boolean }
        networkCapable: { type: boolean }
        paperSize: { type: string, maxLength: 255 }
    ProjectorTechnicalProfile:
      type: object
      additionalProperties: false
      properties:
        technology: { type: string, maxLength: 255 }
        brightnessLumens: { type: number, minimum: 0 }
        nativeResolution: { type: string, maxLength: 255 }
    UpsTechnicalProfile:
      type: object
      additionalProperties: false
      properties:
        capacityVA: { type: number, minimum: 0 }
        powerWatts: { type: number, minimum: 0 }
        batteryCount: { type: integer, minimum: 0 }
        batteryVoltage: { type: number, minimum: 0 }
        runtimeMinutes: { type: number, minimum: 0 }
    OtherTechnicalProfile:
      type: object
      maxProperties: 32
      propertyNames:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z][A-Za-z0-9_.-]*$'
      additionalProperties:
        anyOf:
          - type: string
            maxLength: 500
          - type: number
          - type: boolean
          - type: 'null'
    LayoutStatus:
      type: string
      enum: [draft, active, archived]
    StructuralLayoutElementType:
      type: string
      enum: [teacher_desk, door, window, wall, aisle, label]
    DevicePlacementRole:
      type: [string, 'null']
      enum: [student_station, teacher_station, null]
    LayoutRotation:
      type: integer
      enum: [0, 90, 180, 270]
    LayoutPaginationMeta:
      type: object
      additionalProperties: false
      required: [page, perPage, total, lastPage]
      properties:
        page: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        lastPage: { type: integer, minimum: 1 }
    LayoutSummaryCollectionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LayoutSummary' }
        meta: { $ref: '#/components/schemas/LayoutPaginationMeta' }
    LayoutResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Layout' }
    LayoutSummary:
      type: object
      additionalProperties: false
      required: [id, schoolId, laboratoryId, name, templateKey, rows, columns, status, version, activatedAt, archivedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: ulid, readOnly: true }
        schoolId: { type: string, format: ulid, readOnly: true }
        laboratoryId: { type: string, format: ulid, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 255 }
        templateKey:
          type: [string, 'null']
          maxLength: 100
          description: Frontend template provenance only; not a backend geometry mode.
        rows: { type: integer, minimum: 1, maximum: 50 }
        columns: { type: integer, minimum: 1, maximum: 50 }
        status: { $ref: '#/components/schemas/LayoutStatus' }
        version: { type: integer, minimum: 1, readOnly: true }
        activatedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        archivedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
    Layout:
      type: object
      additionalProperties: false
      required: [id, schoolId, laboratoryId, name, templateKey, rows, columns, status, version, structuralElements, devicePlacements, activatedAt, archivedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: ulid, readOnly: true }
        schoolId: { type: string, format: ulid, readOnly: true }
        laboratoryId: { type: string, format: ulid, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 255 }
        templateKey: { type: [string, 'null'], maxLength: 100 }
        rows: { type: integer, minimum: 1, maximum: 50 }
        columns: { type: integer, minimum: 1, maximum: 50 }
        status: { $ref: '#/components/schemas/LayoutStatus' }
        version: { type: integer, minimum: 1, readOnly: true }
        structuralElements:
          type: array
          maxItems: 2500
          items: { $ref: '#/components/schemas/StructuralLayoutElement' }
        devicePlacements:
          type: array
          maxItems: 2500
          items: { $ref: '#/components/schemas/DevicePlacement' }
        activatedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        archivedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
    StructuralLayoutElement:
      type: object
      additionalProperties: false
      required: [id, type, label, row, column, rowSpan, columnSpan, rotation]
      properties:
        id: { type: string, format: ulid, readOnly: true }
        type: { $ref: '#/components/schemas/StructuralLayoutElementType' }
        label: { type: [string, 'null'], maxLength: 60 }
        row: { type: integer, minimum: 1 }
        column: { type: integer, minimum: 1 }
        rowSpan: { type: integer, minimum: 1 }
        columnSpan: { type: integer, minimum: 1 }
        rotation: { $ref: '#/components/schemas/LayoutRotation' }
    StructuralLayoutElementInput:
      type: object
      additionalProperties: false
      required: [type, row, column, rowSpan, columnSpan, rotation]
      properties:
        id:
          type: string
          format: ulid
          description: Existing child ID belonging to this exact draft. New children omit this property; explicit null is invalid.
        type: { $ref: '#/components/schemas/StructuralLayoutElementType' }
        label:
          type: [string, 'null']
          maxLength: 60
          description: Required nonblank text for type label, forbidden/nonblank-null for aisle, optional for other structural types.
        row: { type: integer, minimum: 1 }
        column: { type: integer, minimum: 1 }
        rowSpan: { type: integer, minimum: 1 }
        columnSpan: { type: integer, minimum: 1 }
        rotation: { $ref: '#/components/schemas/LayoutRotation' }
    DevicePlacement:
      type: object
      additionalProperties: false
      required: [id, deviceId, role, label, row, column, rowSpan, columnSpan, rotation]
      properties:
        id: { type: string, format: ulid, readOnly: true }
        deviceId: { type: string, format: ulid }
        role: { $ref: '#/components/schemas/DevicePlacementRole' }
        label: { type: [string, 'null'], maxLength: 60 }
        row: { type: integer, minimum: 1 }
        column: { type: integer, minimum: 1 }
        rowSpan: { type: integer, minimum: 1 }
        columnSpan: { type: integer, minimum: 1 }
        rotation: { $ref: '#/components/schemas/LayoutRotation' }
    DevicePlacementInput:
      type: object
      additionalProperties: false
      required: [deviceId, row, column, rowSpan, columnSpan, rotation]
      properties:
        id:
          type: string
          format: ulid
          description: Existing child ID belonging to this exact draft. New children omit this property; explicit null is invalid.
        deviceId: { type: string, format: ulid }
        role: { $ref: '#/components/schemas/DevicePlacementRole' }
        label: { type: [string, 'null'], maxLength: 60 }
        row: { type: integer, minimum: 1 }
        column: { type: integer, minimum: 1 }
        rowSpan: { type: integer, minimum: 1 }
        columnSpan: { type: integer, minimum: 1 }
        rotation: { $ref: '#/components/schemas/LayoutRotation' }
    CreateLayoutRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Required when there is no active Layout; optional override when cloning.
        templateKey:
          type: [string, 'null']
          maxLength: 100
          description: Optional only when there is no active Layout; rejected for clone creation.
        rows:
          type: integer
          minimum: 1
          maximum: 50
          description: Required only when there is no active Layout; rejected for clone creation.
        columns:
          type: integer
          minimum: 1
          maximum: 50
          description: Required only when there is no active Layout; rejected for clone creation.
    ReplaceLayoutRequest:
      type: object
      additionalProperties: false
      required: [name, templateKey, rows, columns, structuralElements, devicePlacements]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        templateKey: { type: [string, 'null'], maxLength: 100 }
        rows: { type: integer, minimum: 1, maximum: 50 }
        columns: { type: integer, minimum: 1, maximum: 50 }
        structuralElements:
          type: array
          maxItems: 2500
          items: { $ref: '#/components/schemas/StructuralLayoutElementInput' }
        devicePlacements:
          type: array
          maxItems: 2500
          items: { $ref: '#/components/schemas/DevicePlacementInput' }
    UnplacedDeviceCandidate:
      type: object
      additionalProperties: false
      required: [id, deviceCode, deviceType, lifecycleStatus, hostname, brand, model]
      properties:
        id: { type: string, format: ulid }
        deviceCode: { type: string, minLength: 3, maxLength: 32 }
        deviceType: { $ref: '#/components/schemas/DeviceType' }
        lifecycleStatus:
          type: string
          enum: [in_service, spare]
        hostname: { type: [string, 'null'], maxLength: 255 }
        brand: { type: [string, 'null'], maxLength: 255 }
        model: { type: [string, 'null'], maxLength: 255 }
    UnplacedDeviceCollectionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/UnplacedDeviceCandidate' }
        meta: { $ref: '#/components/schemas/LayoutPaginationMeta' }
    ApiError:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
        code:
          type: string
          enum: [UNAUTHENTICATED, INVALID_CREDENTIALS, TOO_MANY_LOGIN_ATTEMPTS, ACTIVE_MEMBERSHIP_REQUIRED, SCHOOL_CONTEXT_REQUIRED, FORBIDDEN, LABORATORY_NOT_FOUND, DEVICE_NOT_FOUND, LAYOUT_NOT_FOUND, INCIDENT_NOT_FOUND, INCIDENT_INVALID_TRANSITION, INCIDENT_ASSIGNEE_INELIGIBLE, INCIDENT_STATUS_CONFLICT, INCIDENT_VERSION_CONFLICT, PRECONDITION_REQUIRED, DEVICE_VERSION_CONFLICT, LAYOUT_VERSION_CONFLICT, DEVICE_HOME_LABORATORY_TRANSFER_REQUIRED, DEVICE_LIFECYCLE_TRANSITION_INVALID, LAYOUT_DRAFT_ALREADY_EXISTS, LAYOUT_STATUS_CONFLICT, LAYOUT_LABORATORY_INACTIVE, LAYOUT_DEVICE_ALREADY_PLACED, LAYOUT_DEVICE_HOME_MISMATCH, LAYOUT_DEVICE_NOT_ELIGIBLE, LAYOUT_POSITION_OCCUPIED]
    ValidationError:
      type: object
      required: [message, code, errors]
      properties:
        message:
          type: string
        code:
          type: string
          const: VALIDATION_FAILED
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
