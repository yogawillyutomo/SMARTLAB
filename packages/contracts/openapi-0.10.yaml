      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/IncidentEvent' }
        meta: { $ref: '#/components/schemas/IncidentPaginationMeta' }
    IncidentEvent:
      type: object
      additionalProperties: false
      required: [id, incidentId, ticketNumber, actor, eventType, incidentVersionBefore, incidentVersionAfter, payload, createdAt]
      properties:
        id: { type: string, format: ulid, readOnly: true }
        incidentId: { type: string, format: ulid, readOnly: true, description: Immutable Incident identifier snapshot. }
        ticketNumber: { type: string, pattern: '^INC-[0-9]{4}-[0-9]{6}$', readOnly: true, description: Immutable ticket-number snapshot. }
        actor: { $ref: '#/components/schemas/IncidentEventActorSnapshot' }
        eventType:
          type: string
          enum: [incident.reported, incident.updated, incident.triaged, incident.assigned, incident.reassigned, incident.started, incident.resolved, incident.reopened, incident.verified, incident.closed, incident.rejected, incident.comment_added]
          readOnly: true
        incidentVersionBefore: { type: integer, minimum: 0, readOnly: true }
        incidentVersionAfter: { type: integer, minimum: 1, readOnly: true }
        payload:
          type: object
          readOnly: true
          description: Exact immutable typed payload validated against eventType when the event was written.
          additionalProperties: true
        createdAt: { type: string, format: date-time, readOnly: true }
    IncidentEventActorSnapshot:
      type: object
      additionalProperties: false
      required: [userId, membershipId, name]
      properties:
        userId: { type: string, format: ulid, readOnly: true }
        membershipId: { type: string, format: ulid, readOnly: true }
        name: { type: string, maxLength: 255, readOnly: true }
    IncidentResponse:
