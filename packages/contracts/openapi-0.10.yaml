    CreateIncidentRequest:
      type: object
      additionalProperties: false
      required: [submissionId, laboratoryId, category, title, description, occurredAt]
      properties:
        submissionId:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          description: Fresh lowercase canonical RFC 4122 UUID v4 for one create attempt.
        laboratoryId: { type: string, format: ulid }
        deviceId:
          anyOf:
            - { type: string, format: ulid }
            - { type: string, pattern: '^\s*$' }
            - { type: 'null' }
          default: null
          description: A blank string or null is canonicalized to null; a nonblank value is normalized as a ULID.
        category:
          type: string
          pattern: '^\s*(?:[Hh][Aa][Rr][Dd][Ww][Aa][Rr][Ee]|[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]|[Nn][Ee][Tt][Ww][Oo][Rr][Kk]|[Ee][Ll][Ee][Cc][Tt][Rr][Ii][Cc][Aa][Ll]|[Pp][Ee][Rr][Ii][Pp][Hh][Ee][Rr][Aa][Ll]|[Ff][Aa][Cc][Ii][Ll][Ii][Tt][Yy]|[Cc][Ll][Ee][Aa][Nn][Ll][Ii][Nn][Ee][Ss][Ss]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]|[Oo][Tt][Hh][Ee][Rr])\s*$'
          description: "Case-insensitive value normalized to lowercase: hardware, software, network, electrical, peripheral, facility, cleanliness, security, or other."
        priority:
          type: string
          pattern: '^\s*(?:[Ll][Oo][Ww]|[Nn][Oo][Rr][Mm][Aa][Ll]|[Hh][Ii][Gg][Hh]|[Cc][Rr][Ii][Tt][Ii][Cc][Aa][Ll])\s*$'
          default: normal
          description: "Case-insensitive value normalized to lowercase: low, normal, high, or critical."
        title: { type: string, minLength: 5, maxLength: 200 }
        description: { type: string, minLength: 10, maxLength: 4000 }
        impact:
          type: [string, 'null']
          maxLength: 2000
          default: null
          description: Blank text or null is canonicalized to null.
        blocksLaboratoryOperation: { type: boolean, default: false }
        stepsTaken:
          type: [string, 'null']
          maxLength: 2000
          default: null
          description: Blank text or null is canonicalized to null.
        occurredAt:
          type: string
          format: date-time
          description: RFC3339 observation time no later than five minutes after server receipt; timezone-offset equivalents are canonicalized to UTC for fingerprinting.
    UpdateIncidentRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 10
      description: Nonempty reported-state correction. Omitted fields remain unchanged; values are normalized before equality and no create defaults are applied.
      properties:
        laboratoryId: { type: string, format: ulid }
        deviceId:
          anyOf:
            - { type: string, format: ulid }
            - { type: string, pattern: '^\s*$' }
            - { type: 'null' }
          description: A blank string or null is canonicalized to null.
        category:
          type: string
          pattern: '^\s*(?:[Hh][Aa][Rr][Dd][Ww][Aa][Rr][Ee]|[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]|[Nn][Ee][Tt][Ww][Oo][Rr][Kk]|[Ee][Ll][Ee][Cc][Tt][Rr][Ii][Cc][Aa][Ll]|[Pp][Ee][Rr][Ii][Pp][Hh][Ee][Rr][Aa][Ll]|[Ff][Aa][Cc][Ii][Ll][Ii][Tt][Yy]|[Cc][Ll][Ee][Aa][Nn][Ll][Ii][Nn][Ee][Ss][Ss]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]|[Oo][Tt][Hh][Ee][Rr])\s*$'
          description: "Case-insensitive value normalized to lowercase: hardware, software, network, electrical, peripheral, facility, cleanliness, security, or other."
        priority:
          type: string
          pattern: '^\s*(?:[Ll][Oo][Ww]|[Nn][Oo][Rr][Mm][Aa][Ll]|[Hh][Ii][Gg][Hh]|[Cc][Rr][Ii][Tt][Ii][Cc][Aa][Ll])\s*$'
          description: "Case-insensitive value normalized to lowercase: low, normal, high, or critical."
        title: { type: string, minLength: 5, maxLength: 200 }
        description: { type: string, minLength: 10, maxLength: 4000 }
        impact:
          type: [string, 'null']
          maxLength: 2000
          description: Blank text or null is canonicalized to null.
        blocksLaboratoryOperation: { type: boolean }
        stepsTaken:
          type: [string, 'null']
          maxLength: 2000
          description: Blank text or null is canonicalized to null.
        occurredAt:
          type: string
          format: date-time
          description: RFC3339 observation time no later than five minutes after server receipt; timezone-offset equivalents are canonicalized to UTC.
    AssignIncidentRequest:
      type: object
      additionalProperties: false
      required: [assigneeMembershipId]
      properties:
        assigneeMembershipId:
          type: string
          format: ulid
          description: Same-School SchoolMembership candidate. Input is trimmed and canonicalized to lowercase before lookup.
        reason:
          type: [string, 'null']
          maxLength: 1000
          description: Optional for initial assignment and ignored by same-assignee no-op. Reassignment to a different membership requires 5-1000 normalized characters.
    TransitionIncidentRequest:
      type: object
      additionalProperties: false
      required: [toStatus]
      description: Closed lifecycle command union. Structural validation occurs before Incident visibility; edge-specific allowed/required fields and minimum lengths are evaluated only after the locked lifecycle edge and its exact permission are resolved.
      properties:
        toStatus:
          type: string
          enum: [reported, triaged, assigned, in_progress, resolved, verified, closed, rejected]
          description: Requested lifecycle target. Same-status, unsupported, and triaged-to-assigned requests reach the edge resolver and return `INCIDENT_INVALID_TRANSITION` rather than structural validation errors.
        triageSummary:
          type: [string, 'null']
          maxLength: 2000
          description: Required with 1-2000 normalized characters for reported-to-triaged only.
        priority:
          type: string
          enum: [low, normal, high, critical]
          description: Optional finalized priority for reported-to-triaged only.
        impact:
          type: [string, 'null']
          maxLength: 2000
          description: Optional finalized impact for reported-to-triaged only; blank text is normalized to null.
        blocksLaboratoryOperation:
          type: boolean
          description: Optional finalized blocking flag for reported-to-triaged only.
        resolutionSummary:
          type: [string, 'null']
          maxLength: 4000
          description: Required with 5-4000 normalized characters for every resolve edge.
        verificationNote:
          type: [string, 'null']
          maxLength: 2000
          description: Required with 1-2000 normalized characters for resolved-to-verified.
        reason:
          type: [string, 'null']
          maxLength: 1000
          description: Required with 5-1000 normalized characters for rejection and both path-aware reopen edges.
    CreateIncidentCommentRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: Trimmed and NFC-normalized before validation; the normalized value must contain 1-2000 characters.
    IncidentCommentResponse:
