openapi: 3.1.0
info:
  title: SmartLab Published Timetable API module
  version: 0.19.0
  description: Published timetable ingestion/activation, current-plan Schedule Occurrences, and the S2.8 fail-closed publication impact/reconciliation gate.
paths:
  /timetable-publications:
    get:
      operationId: listTimetablePublications
      summary: List current-School timetable publications
      description: Requires `schedules.view`. Does not expose the raw source payload.
      security: &auth
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - name: semesterId
          in: query
          schema: { type: string, format: ulid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PublicationStatus' }
        - name: sourcePublicationId
          in: query
          schema: { type: string, maxLength: 128 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200': { $ref: '#/components/responses/PublicationCollection' }
        '401': { $ref: './openapi-0.10.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './openapi-0.10.yaml#/components/responses/Forbidden' }
        '409': { $ref: './openapi-0.10.yaml#/components/responses/MembershipContextConflict' }
        '422': { $ref: './openapi-0.10.yaml#/components/responses/ValidationFailed' }
    post:
      operationId: ingestTimetablePublication
      summary: Ingest and fully validate one TESSELA timetable snapshot
      description: |
        Requires `schedules.ingest`. S2.2 accepts `sourceSystem=tessela`,
        `schemaVersion=1.0`, and the transitional `academicReferenceSource=smartlab`.
        An unseen immutable version returns 201 after full validation/materialization.
        An identical replay returns 200 with `X-Timetable-Replayed: true`.
        The same source version with different canonical content is rejected.
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTimetablePublicationRequest' }
      responses:
        '200':
          description: Idempotent replay of an existing immutable version.
          headers:
            X-Timetable-Replayed:
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationEnvelope' }
        '201':
          description: Publication staged, validated, and occurrences materialized.
          headers:
            X-Timetable-Replayed:
              schema: { type: string, enum: ['false'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationEnvelope' }
        '401': { $ref: './openapi-0.10.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './openapi-0.10.yaml#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/PublicationConflict' }
        '422': { $ref: '#/components/responses/PublicationInvalid' }

  /timetable-publications/{publicationId}:
    parameters:
      - $ref: '#/components/parameters/PublicationId'
    get:
      operationId: getTimetablePublication
      summary: Read one current-School timetable publication
      description: Requires `schedules.view`.
      security: *auth
      responses:
        '200':
          description: Publication detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationEnvelope' }
        '401': { $ref: './openapi-0.10.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './openapi-0.10.yaml#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/PublicationNotFound' }

  /timetable-publications/{publicationId}/impact:
    parameters:
      - $ref: '#/components/parameters/PublicationId'
    get:
      operationId: previewTimetablePublicationImpact
      summary: Preview operational impact before activating a validated timetable publication
      description: |
        Requires schedules.activate. The preview compares future occurrences against
        the current active publication and evaluates operational commitments that would
        become unsafe: active Schedule Exceptions, submitted/approved Reservations,
        approved Priority Events, active Calendar blockers, inactive Laboratories. It never changes state and never proposes solver output.
      security: *auth
      responses:
        '200':
          description: Deterministic impact preview with schedule diff, blockers, and fingerprint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationImpactEnvelope' }
        '401': { $ref: './openapi-0.10.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './openapi-0.10.yaml#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/PublicationNotFound' }
        '409': { $ref: '#/components/responses/PublicationConflict' }

  /timetable-publications/{publicationId}/activate:
    parameters:
      - $ref: '#/components/parameters/PublicationId'
    post:
      operationId: activateTimetablePublication
      summary: Atomically activate one fully validated timetable publication
      description: |
        Requires `schedules.activate`. Activation may supersede the current active
        publication for the same School + Semester. Future-effective and expired
        publications cannot be activated. Old source versions cannot roll back a newer
        active source version. Before superseding the current plan, SmartLab recalculates
        the S2.8 operational impact inside the activation transaction. Any unresolved
        blocker fails closed with TIMETABLE_PUBLICATION_RECONCILIATION_REQUIRED; there is
        no force-activation endpoint.
      security: *auth
      responses:
        '200':
          description: Active publication.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationEnvelope' }
        '401': { $ref: './openapi-0.10.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './openapi-0.10.yaml#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/PublicationNotFound' }
        '409': { $ref: '#/components/responses/PublicationConflict' }

  /schedule-occurrences:
    get:
      operationId: listScheduleOccurrences
      summary: List current-plan Schedule Occurrences for a bounded date range
      description: |
        Requires schedules.view. Returns only occurrences belonging to timetable
        publications that are currently active for the authenticated School.
        This is a current-plan projection, not a historical reconstruction of which
        publication was active on a past date. The immutable planned fields remain
        TESSELA source evidence; operationalStatus, operationalLaboratory, and exception
        overlay an active SmartLab Schedule Exception without rewriting that source.
        Date ranges are inclusive and limited to 14 calendar days.
      security: *auth
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: laboratoryId
          in: query
          schema: { type: string, format: ulid }
        - name: teacherId
          in: query
          schema: { type: string, format: ulid }
        - name: academicClassId
          in: query
          schema: { type: string, format: ulid }
        - name: subjectId
          in: query
          schema: { type: string, format: ulid }
        - name: activityType
          in: query
          schema: { $ref: '#/components/schemas/ActivityType' }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 250 }
      responses:
        '200': { $ref: '#/components/responses/ScheduleOccurrenceCollection' }
        '401': { $ref: './openapi-0.10.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './openapi-0.10.yaml#/components/responses/Forbidden' }
        '409': { $ref: './openapi-0.10.yaml#/components/responses/MembershipContextConflict' }
        '422': { $ref: './openapi-0.10.yaml#/components/responses/ValidationFailed' }
components:
  parameters:
    PublicationId:
      name: publicationId
      in: path
      required: true
      schema: { type: string, format: ulid }

  schemas:
    PublicationImpactBlockerType:
      type: string
      enum:
        - active_schedule_exception
        - reservation_conflict
        - priority_event_conflict
        - calendar_blocker_conflict
        - laboratory_status_conflict

    PublicationScheduleDiff:
      type: object
      additionalProperties: false
      required: [added, removed, changed, unchanged]
      properties:
        added: { type: integer, minimum: 0 }
        removed: { type: integer, minimum: 0 }
        changed: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }

    PublicationImpactPublicationRef:
      type: object
      additionalProperties: false
      required: [id, sourcePublicationId, sourceVersion]
      properties:
        id: { type: string, format: ulid }
        sourcePublicationId: { type: string, minLength: 1 }
        sourceVersion: { type: integer, minimum: 1 }
        status: { type: string }

    PublicationImpactBlocker:
      type: object
      additionalProperties: false
      required: [type, entityId, date, laboratoryId, title, details]
      properties:
        type: { $ref: '#/components/schemas/PublicationImpactBlockerType' }
        entityId: { type: string }
        date: { type: string, format: date }
        laboratoryId: { type: [string, 'null'] }
        title: { type: string }
        details: { type: object, additionalProperties: true }

    PublicationImpact:
      type: object
      additionalProperties: false
      required:
        - publication
        - currentPublication
        - window
        - scheduleDiff
        - clear
        - blockerCount
        - blockers
        - truncated
        - fingerprint
      properties:
        publication: { $ref: '#/components/schemas/PublicationImpactPublicationRef' }
        currentPublication:
          oneOf:
            - { $ref: '#/components/schemas/PublicationImpactPublicationRef' }
            - { type: 'null' }
        window:
          type: object
          additionalProperties: false
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        scheduleDiff: { $ref: '#/components/schemas/PublicationScheduleDiff' }
        clear: { type: boolean }
        blockerCount: { type: integer, minimum: 0 }
        blockers:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/PublicationImpactBlocker' }
        truncated:
          type: boolean
          description: True when blockerCount exceeds the returned blocker list.
        fingerprint:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Deterministic hash of candidate/current identity, future window, schedule diff, and all blockers.

    PublicationImpactEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/PublicationImpact' }

    ScheduleReference:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id: { type: string, format: ulid }
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }

    ScheduleOccurrenceException:
      type: object
      additionalProperties: false
      required: [id, resolution, reason, approvedByName, version, createdAt, replacementLaboratory]
      properties:
        id: { type: string, format: ulid }
        resolution: { type: string, enum: [cancel, relocate] }
        reason: { type: string, minLength: 1 }
        approvedByName: { type: string, minLength: 1 }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        replacementLaboratory:
          oneOf:
            - { $ref: '#/components/schemas/ScheduleReference' }
            - { type: 'null' }

    ScheduleOccurrence:
      type: object
      additionalProperties: false
      required:
        - id
        - schoolId
        - publicationId
        - sourcePublicationId
        - sourceVersion
        - sourceScheduleId
        - occursOn
        - activityType
        - teacher
        - academicClass
        - subject
        - plannedLaboratory
        - operationalStatus
        - operationalLaboratory
        - exception
        - lessonPeriodSetId
        - startLessonPeriodId
        - endLessonPeriodId
        - startTime
        - endTime
        - instructionPeriodCount
      properties:
        id: { type: string, format: ulid }
        schoolId: { type: string, format: ulid }
        publicationId: { type: string, format: ulid }
        sourcePublicationId: { type: string, minLength: 1 }
        sourceVersion: { type: integer, minimum: 1 }
        sourceScheduleId: { type: string, minLength: 1 }
        occursOn: { type: string, format: date }
        activityType: { $ref: '#/components/schemas/ActivityType' }
        teacher: { $ref: '#/components/schemas/ScheduleReference' }
        academicClass: { $ref: '#/components/schemas/ScheduleReference' }
        subject: { $ref: '#/components/schemas/ScheduleReference' }
        plannedLaboratory:
          description: Immutable Laboratory assignment from the active TESSELA source publication.
          oneOf:
            - { $ref: '#/components/schemas/ScheduleReference' }
            - { type: 'null' }
        operationalStatus:
          type: string
          enum: [scheduled, cancelled, relocated]
        operationalLaboratory:
          description: Effective dated Laboratory after the active SmartLab exception overlay; null when cancelled or unplanned.
          oneOf:
            - { $ref: '#/components/schemas/ScheduleReference' }
            - { type: 'null' }
        exception:
          oneOf:
            - { $ref: '#/components/schemas/ScheduleOccurrenceException' }
            - { type: 'null' }
        lessonPeriodSetId: { type: string, format: ulid }
        startLessonPeriodId: { type: string, format: ulid }
        endLessonPeriodId: { type: string, format: ulid }
        startTime: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$' }
        endTime: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$' }
        instructionPeriodCount: { type: integer, minimum: 1 }

    ScheduleOccurrenceMeta:
      type: object
      additionalProperties: false
      required: [page, perPage, total, lastPage, from, to, activePublicationCount]
      properties:
        page: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 1, maximum: 1000 }
        total: { type: integer, minimum: 0 }
        lastPage: { type: integer, minimum: 1 }
        from: { type: string, format: date }
        to: { type: string, format: date }
        activePublicationCount: { type: integer, minimum: 0 }

    ScheduleOccurrenceCollectionEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ScheduleOccurrence' }
        meta: { $ref: '#/components/schemas/ScheduleOccurrenceMeta' }
    PublicationStatus:
      type: string
      enum: [staged, validated, active, superseded, rejected]

    ActivityType:
      type: string
      enum: [practical, theory, exam, other]

    RecurrenceKind:
      type: string
      enum: [weekly, single_date]

    SourceSnapshots:
      type: object
      additionalProperties: false
      properties:
        teacherCode: { type: [string, 'null'], maxLength: 255 }
        teacherName: { type: [string, 'null'], maxLength: 255 }
        classCode: { type: [string, 'null'], maxLength: 255 }
        className: { type: [string, 'null'], maxLength: 255 }
        subjectCode: { type: [string, 'null'], maxLength: 255 }
        subjectName: { type: [string, 'null'], maxLength: 255 }
        laboratoryCode: { type: [string, 'null'], maxLength: 255 }
        laboratoryName: { type: [string, 'null'], maxLength: 255 }

    TimetableEntryInput:
      type: object
      additionalProperties: false
      required:
        - sourceScheduleId
        - teacherSourceId
        - academicClassSourceId
        - subjectSourceId
        - lessonPeriodSetSourceId
        - startLessonPeriodSourceId
        - endLessonPeriodSourceId
        - activityType
        - recurrenceKind
      properties:
        sourceScheduleId: { type: string, minLength: 1, maxLength: 128 }
        teacherSourceId: { type: string, minLength: 1, maxLength: 128 }
        academicClassSourceId: { type: string, minLength: 1, maxLength: 128 }
        subjectSourceId: { type: string, minLength: 1, maxLength: 128 }
        lessonPeriodSetSourceId: { type: string, minLength: 1, maxLength: 128 }
        startLessonPeriodSourceId: { type: string, minLength: 1, maxLength: 128 }
        endLessonPeriodSourceId: { type: string, minLength: 1, maxLength: 128 }
        plannedLaboratoryId: { type: [string, 'null'], maxLength: 128 }
        activityType: { $ref: '#/components/schemas/ActivityType' }
        recurrenceKind: { $ref: '#/components/schemas/RecurrenceKind' }
        weekday:
          type: [integer, 'null']
          minimum: 1
          maximum: 7
          description: ISO weekday, required for weekly recurrence.
        entryEffectiveFrom: { type: [string, 'null'], format: date }
        entryEffectiveTo: { type: [string, 'null'], format: date }
        occursOn: { type: [string, 'null'], format: date }
        sourceSnapshots: { oneOf: [{ $ref: '#/components/schemas/SourceSnapshots' }, { type: 'null' }] }

    CreateTimetablePublicationRequest:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - sourceSystem
        - sourcePublicationId
        - sourceVersion
        - academicReferenceSource
        - schoolSourceId
        - academicYearSourceId
        - semesterSourceId
        - publishedAt
        - effectiveFrom
        - effectiveTo
        - entries
      properties:
        schemaVersion: { type: string, enum: ['1.0'] }
        sourceSystem: { type: string, enum: [tessela] }
        sourcePublicationId: { type: string, minLength: 1, maxLength: 128 }
        sourceVersion: { type: integer, minimum: 1 }
        academicReferenceSource:
          type: string
          enum: [smartlab]
          description: S2.2 transitional namespace. BP Master Data mapping is a later slice.
        schoolSourceId: { type: string, minLength: 1, maxLength: 128 }
        academicYearSourceId: { type: string, minLength: 1, maxLength: 128 }
        semesterSourceId: { type: string, minLength: 1, maxLength: 128 }
        publishedAt: { type: string, format: date-time }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        entries:
          type: array
          minItems: 1
          maxItems: 5000
          items: { $ref: '#/components/schemas/TimetableEntryInput' }

    ValidationSummary:
      type: object
      additionalProperties: true
      required: [entriesReceived, entriesNormalized, occurrencesMaterialized, errors, warnings]
      properties:
        entriesReceived: { type: integer, minimum: 0 }
        entriesNormalized: { type: integer, minimum: 0 }
        occurrencesMaterialized: { type: integer, minimum: 0 }
        errors: { type: integer, minimum: 0 }
        warnings: { type: integer, minimum: 0 }
        diagnostics: { type: object, additionalProperties: true }

    TimetablePublication:
      type: object
      required:
        - id
        - schoolId
        - sourceSystem
        - sourcePublicationId
        - sourceVersion
        - schemaVersion
        - academicReferenceSource
        - sourceSchoolId
        - sourceAcademicYearId
        - sourceSemesterId
        - publishedAt
        - effectiveFrom
        - effectiveTo
        - payloadSha256
        - status
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: ulid }
        schoolId: { type: string, format: ulid }
        sourceSystem: { type: string, enum: [tessela] }
        sourcePublicationId: { type: string }
        sourceVersion: { type: integer, minimum: 1 }
        schemaVersion: { type: string }
        academicReferenceSource: { type: string }
        sourceSchoolId: { type: string }
        sourceAcademicYearId: { type: string }
        sourceSemesterId: { type: string }
        academicYearId: { type: [string, 'null'], format: ulid }
        semesterId: { type: [string, 'null'], format: ulid }
        publishedAt: { type: string, format: date-time }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        payloadSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        status: { $ref: '#/components/schemas/PublicationStatus' }
        validationSummary: { oneOf: [{ $ref: '#/components/schemas/ValidationSummary' }, { type: 'null' }] }
        validatedAt: { type: [string, 'null'], format: date-time }
        activatedAt: { type: [string, 'null'], format: date-time }
        supersededAt: { type: [string, 'null'], format: date-time }
        supersededById: { type: [string, 'null'], format: ulid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PublicationEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/TimetablePublication' }

    PaginationMeta:
      type: object
      required: [page, perPage, total, lastPage]
      properties:
        page: { type: integer }
        perPage: { type: integer }
        total: { type: integer }
        lastPage: { type: integer }

    PublicationCollectionEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TimetablePublication' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    DomainError:
      type: object
      required: [message, code]
      properties:
        message: { type: string }
        code: { type: string }
        errors: { type: object, additionalProperties: true }
        details: { type: object, additionalProperties: true }

  responses:
    ScheduleOccurrenceCollection:
      description: Paginated current-plan Schedule Occurrences for the authenticated School.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ScheduleOccurrenceCollectionEnvelope' }
    PublicationCollection:
      description: Paginated current-School publication list.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicationCollectionEnvelope' }

    PublicationNotFound:
      description: Unknown or cross-School publication.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DomainError' }

    PublicationConflict:
      description: Immutable-version, family, or activation conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DomainError' }

    PublicationInvalid:
      description: Publication failed SmartLab semantic validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DomainError' }
