openapi: 3.1.0
info:
  title: SmartLab Schedule Exception API module
  version: 0.20.0
  description: S2.7 non-destructive dated Schedule Exceptions over immutable TESSELA Schedule Occurrences.
paths:
  /schedule-exceptions:
    get:
      operationId: listScheduleExceptions
      summary: List dated Schedule Exceptions for the active School
      security: &auth [{ sanctumSession: [] }, { sanctumBearer: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: occurrenceId, in: query, schema: { type: string, format: ulid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ScheduleExceptionStatus' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200': { description: Tenant-scoped paginated Schedule Exception collection }
    post:
      operationId: createScheduleException
      summary: Apply one authorized dated operational exception to an active Schedule Occurrence
      description: |
        Requires schedule-exceptions.create. S2.7 supports only cancel and relocate.
        It never changes the immutable source ScheduleOccurrence or the recurring
        TESSELA timetable. Relocation preserves the occurrence date/time/teacher/class/
        subject and must pass replacement-Laboratory capacity and Unified Availability
        validation inside the mutation transaction.
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateScheduleExceptionInput' }
      responses:
        '201':
          description: Active direct-approved Schedule Exception. ETag equals the entity version.
        '404':
          description: Source occurrence does not belong to the active School/current active publication.
        '409':
          description: Active exception already exists, relocation target is unavailable, or the occurrence owns a prepared/in-progress Laboratory Session.
        '422':
          description: Invalid resolution shape, Laboratory reference, or relocation capacity.
  /schedule-exceptions/{scheduleExceptionId}:
    parameters:
      - { name: scheduleExceptionId, in: path, required: true, schema: { type: string, format: ulid } }
    get:
      operationId: getScheduleException
      security: *auth
      responses:
        '200': { description: Schedule Exception detail and append-oriented audit timeline }
        '404': { description: Unknown or cross-School Schedule Exception }
  /schedule-exceptions/{scheduleExceptionId}/cancel:
    parameters:
      - { name: scheduleExceptionId, in: path, required: true, schema: { type: string, format: ulid } }
      - { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
    post:
      operationId: cancelScheduleException
      summary: Cancel an active exception and safely restore current TESSELA occurrence behavior
      description: |
        Requires schedule-exceptions.cancel. When the source publication remains active
        and the source occurrence has a planned Laboratory, SmartLab re-checks Unified
        Availability before restoring the original occupancy. Restoration fails closed
        if a new blocker would make the source Laboratory unsafe.
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200': { description: Cancelled exception. The response ETag carries the new entity version. }
        '409': { description: State conflict, active Laboratory Session source commitment, or unsafe source-occurrence restoration. }
        '412': { description: Schedule Exception version conflict. }
        '428': { description: Missing or malformed If-Match version. }
components:
  schemas:
    ScheduleExceptionResolution:
      type: string
      enum: [cancel, relocate]
    ScheduleExceptionStatus:
      type: string
      enum: [active, cancelled]
    CreateScheduleExceptionInput:
      type: object
      additionalProperties: false
      required: [occurrenceId, resolution, reason]
      properties:
        occurrenceId: { type: string, format: ulid }
        resolution: { $ref: '#/components/schemas/ScheduleExceptionResolution' }
        replacementLaboratoryId:
          type: [string, 'null']
          format: ulid
          description: Required only for relocate; forbidden for cancel.
        reason: { type: string, minLength: 1, maxLength: 2000 }
