openapi: 3.1.0
info:
  title: SmartLab Laboratory Availability API module
  version: 0.17.0
paths:
  /laboratory-availability:
    get:
      operationId: checkLaboratoryAvailability
      summary: Evaluate one School-local Laboratory window against canonical schedule and operational blockers
      security: [{ sanctumSession: [] }, { sanctumBearer: [] }]
      parameters:
        - { name: laboratoryId, in: query, required: true, schema: { type: string, format: ulid } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: startsAt, in: query, required: true, schema: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$' } }
        - { name: endsAt, in: query, required: true, schema: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$' } }
      responses:
        '200':
          description: Explainable availability decision. Unknown is fail-closed and never reports available=true.
        '404':
          description: Laboratory does not exist in the active School.
components:
  schemas:
    AvailabilityState:
      type: string
      enum: [available, scheduled, blocked, mixed, unknown]
    ScheduleCoverageStatus:
      type: string
      enum: [covered, missing, ambiguous]
    AvailabilityReference:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id: { type: string, format: ulid }
        code: { type: string }
        name: { type: string }
    AvailabilityEvidence:
      type: object
      required: [type, sourceId, title, allDay, startsAt, endsAt, details]
      properties:
        type:
          type: string
          enum: [schedule_occurrence, calendar_event, laboratory_status, reservation]
        sourceId: { type: string }
        title: { type: string }
        allDay: { type: boolean }
        startsAt: { type: [string, 'null'], pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$' }
        endsAt: { type: [string, 'null'], pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$' }
        details: { type: object }
    AvailabilityNotice:
      type: object
      additionalProperties: false
      required: [sourceId, title, allDay, startsAt, endsAt, details]
      properties:
        sourceId: { type: string, format: ulid }
        title: { type: string }
        allDay: { type: boolean }
        startsAt: { type: [string, 'null'] }
        endsAt: { type: [string, 'null'] }
        details:
          type: object
          additionalProperties: false
          required: [category, scope]
          properties:
            category: { type: string }
            scope: { type: string, enum: [school, laboratory] }
