openapi: 3.1.0
info:
  title: SmartLab Preventive Maintenance API module
  version: 0.28.0
paths:
  /maintenance-plans:
    get:
      operationId: listMaintenancePlans
      security: &auth [{ sanctumSession: [] }, { sanctumBearer: [] }]
      responses:
        '200': { description: Tenant-scoped preventive MaintenancePlan collection }
    post:
      operationId: createMaintenancePlan
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMaintenancePlanInput' }
      responses:
        '201': { description: MaintenancePlan bound to one exact canonical Asset }
  /maintenance-plans/{planId}:
    parameters:
      - &planId { name: planId, in: path, required: true, schema: { type: string, format: ulid } }
    get:
      operationId: getMaintenancePlan
      security: *auth
      responses:
        '200': { description: MaintenancePlan detail }
    patch:
      operationId: updateMaintenancePlan
      security: *auth
      parameters:
        - &ifMatchPlan { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMaintenancePlanInput' }
      responses:
        '200': { description: Updated plan metadata; exact Asset identity is immutable }
        '412': { description: Version conflict }
        '428': { description: Missing/invalid If-Match }
  /maintenance-plans/{planId}/activate:
    parameters: [*planId, *ifMatchPlan]
    post:
      operationId: activateMaintenancePlan
      security: *auth
      responses:
        '200': { description: Activated plan }
  /maintenance-plans/{planId}/deactivate:
    parameters: [*planId, *ifMatchPlan]
    post:
      operationId: deactivateMaintenancePlan
      security: *auth
      responses:
        '200': { description: Deactivated plan; retained as history }
  /maintenance-plans/{planId}/executions:
    parameters: [*planId, *ifMatchPlan]
    post:
      operationId: scheduleMaintenanceExecution
      summary: Snapshot the current exact-Asset plan into a scheduled execution
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleMaintenanceExecutionInput' }
      responses:
        '201': { description: Scheduled execution with immutable plan/Asset/checklist snapshots }
  /maintenance-executions:
    get:
      operationId: listMaintenanceExecutions
      security: *auth
      responses:
        '200': { description: Tenant-scoped preventive execution collection }
  /maintenance-executions/{executionId}:
    parameters:
      - &executionId { name: executionId, in: path, required: true, schema: { type: string, format: ulid } }
    get:
      operationId: getMaintenanceExecution
      security: *auth
      responses:
        '200': { description: Execution detail including linked immutable Inventory issue evidence }
  /maintenance-executions/{executionId}/start:
    parameters:
      - *executionId
      - &ifMatchExecution { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
    post:
      operationId: startMaintenanceExecution
      summary: Acquire preventive Maintenance custody for the exact Asset
      security: *auth
      responses:
        '200': { description: In-progress execution with conditionBefore and Asset version snapshot }
        '409': { description: Active Loan/Maintenance custody or Asset/Device eligibility conflict }
  /maintenance-executions/{executionId}/complete:
    parameters: [*executionId, *ifMatchExecution]
    post:
      operationId: completeMaintenanceExecution
      summary: Atomically capture completion evidence, update Asset condition through Asset authority, issue spare parts through Inventory authority, release custody, and advance the plan
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteMaintenanceExecutionInput' }
      responses:
        '200': { description: Completed execution }
        '409': { description: Insufficient stock, Asset version drift, or invalid state }
  /maintenance-executions/{executionId}/cancel:
    parameters: [*executionId, *ifMatchExecution]
    post:
      operationId: cancelMaintenanceExecution
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200': { description: Cancelled execution with custody released }
components:
  schemas:
    FrequencyKind:
      type: string
      enum: [weekly, monthly, quarterly, semester, yearly, custom_interval]
    AssetCondition:
      type: string
      enum: [good, minor_damage, moderate_damage, major_damage, unknown]
    CreateMaintenancePlanInput:
      type: object
      additionalProperties: false
      required: [assetId, name, frequencyKind, checklistTemplate, nextDueDate]
      properties:
        assetId: { type: string, format: ulid }
        name: { type: string, minLength: 3, maxLength: 255 }
        frequencyKind: { $ref: '#/components/schemas/FrequencyKind' }
        intervalDays: { type: [integer, 'null'], minimum: 1, maximum: 3650 }
        checklistTemplate:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 255 }
        assignedTechnicianReference: { type: [string, 'null'], maxLength: 255 }
        assignedTechnicianName: { type: [string, 'null'], maxLength: 255 }
        nextDueDate: { type: string, format: date }
    UpdateMaintenancePlanInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 3, maxLength: 255 }
        frequencyKind: { $ref: '#/components/schemas/FrequencyKind' }
        intervalDays: { type: [integer, 'null'], minimum: 1, maximum: 3650 }
        checklistTemplate:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 255 }
        assignedTechnicianReference: { type: [string, 'null'], maxLength: 255 }
        assignedTechnicianName: { type: [string, 'null'], maxLength: 255 }
        nextDueDate: { type: string, format: date }
    ScheduleMaintenanceExecutionInput:
      type: object
      additionalProperties: false
      required: [scheduledFor, technicianName]
      properties:
        scheduledFor: { type: string, format: date }
        technicianReference: { type: [string, 'null'], maxLength: 255 }
        technicianName: { type: string, minLength: 2, maxLength: 255 }
    CompleteMaintenanceExecutionInput:
      type: object
      additionalProperties: false
      required: [checklistResults, actionTaken, conditionAfter]
      properties:
        checklistResults:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: boolean }
        findings: { type: [string, 'null'], maxLength: 5000 }
        actionTaken: { type: string, minLength: 3, maxLength: 5000 }
        conditionAfter: { $ref: '#/components/schemas/AssetCondition' }
        inventoryIssues:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [inventoryItemId, clientMutationId, quantity]
            properties:
              inventoryItemId: { type: string, format: ulid }
              clientMutationId: { type: string, format: uuid }
              quantity: { type: number, exclusiveMinimum: 0, maximum: 999999999999.999, multipleOf: 0.001 }
    ReasonInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 1000 }
  securitySchemes:
    sanctumSession: { type: apiKey, in: cookie, name: laravel_session }
    sanctumBearer: { type: http, scheme: bearer }
