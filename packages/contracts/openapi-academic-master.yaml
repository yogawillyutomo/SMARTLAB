openapi: 3.1.0
info:
  title: SmartLab Academic Master API module
  version: 0.12.0
  description: Server-authoritative S1B Academic Master Data path items and schemas.
paths:
  /master-data/academic-units:
    get:
      operationId: listAcademicUnits
      summary: List current-School Academic Units
      description: Requires `master-data.view`. Ordered by canonical code then ULID.
      security: &auth
        - sanctumSession: []
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/AcademicUnitType' }
        - name: parentId
          in: query
          schema: { type: string, format: ulid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { $ref: '#/components/responses/AcademicUnitCollection' }
        '401': { $ref: './openapi-0.10.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './openapi-0.10.yaml#/components/responses/Forbidden' }
        '409': { $ref: './openapi-0.10.yaml#/components/responses/MembershipContextConflict' }
        '422': { $ref: './openapi-0.10.yaml#/components/responses/ValidationFailed' }
    post:
      operationId: createAcademicUnit
      summary: Create an Academic Unit
      description: Requires `master-data.create`. Code is normalized to uppercase and becomes immutable.
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAcademicUnitRequest' }
      responses:
        '201': { $ref: '#/components/responses/AcademicUnitCreated' }
        '401': { $ref: './openapi-0.10.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './openapi-0.10.yaml#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AcademicMasterConflict' }
        '422': { $ref: './openapi-0.10.yaml#/components/responses/ValidationFailed' }
  /master-data/academic-units/{academicUnitId}:
    parameters:
      - $ref: '#/components/parameters/AcademicUnitId'
    get:
      operationId: getAcademicUnit
      summary: Read one current-School Academic Unit
      security: *auth
      responses:
        '200': { $ref: '#/components/responses/AcademicUnitDetail' }
        '401': { $ref: './openapi-0.10.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './openapi-0.10.yaml#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AcademicMasterNotFound' }
    patch:
      operationId: updateAcademicUnit
      summary: Update mutable Academic Unit fields
      description: Requires `master-data.update` and strong `If-Match`. Code is immutable. Canonical no-op preserves version, timestamp, ETag, and audit history.
      security: *auth
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAcademicUnitRequest' }
      responses:
        '200': { $ref: '#/components/responses/AcademicUnitDetail' }
        '401': { $ref: './openapi-0.10.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './openapi-0.10.yaml#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AcademicMasterNotFound' }
        '409': { $ref: '#/components/responses/AcademicMasterConflict' }
        '412': { $ref: '#/components/responses/AcademicMasterVersionConflict' }
        '422': { $ref: './openapi-0.10.yaml#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/AcademicMasterPreconditionRequired' }

  /master-data/teachers:
    get:
      operationId: listTeachers
      summary: List current-School Teachers
      description: Requires `master-data.view`. Teacher is a School-owned academic reference, not a User account.
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
        - name: academicUnitId
          in: query
          schema: { type: string, format: ulid }
        - name: membershipId
          in: query
          schema: { type: string, format: ulid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { $ref: '#/components/responses/TeacherCollection' }
        '401': { $ref: './openapi-0.10.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './openapi-0.10.yaml#/components/responses/Forbidden' }
        '409': { $ref: './openapi-0.10.yaml#/components/responses/MembershipContextConflict' }
        '422': { $ref: './openapi-0.10.yaml#/components/responses/ValidationFailed' }
    post:
      operationId: createTeacher
      summary: Create a Teacher master record
      description: Requires `master-data.create`. Optional membership link must belong to the same School and never mutates User data.
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTeacherRequest' }
      responses:
        '201': { $ref: '#/components/responses/TeacherCreated' }
        '401': { $ref: './openapi-0.10.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './openapi-0.10.yaml#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AcademicMasterConflict' }
        '422': { $ref: './openapi-0.10.yaml#/components/responses/ValidationFailed' }
  /master-data/teachers/{teacherId}:
    parameters:
      - $ref: '#/components/parameters/TeacherId'
    get:
